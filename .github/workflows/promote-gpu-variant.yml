# Promote one GA GPU image from the already-validated RC.
# The caller deliberately invokes this workflow once per variant so CUDA and
# Vulkan have independent scheduling, status, retries, and failure domains.
#
# source=retag (default): release-docker.yml builds `:<rc>-<variant>` during
# the rc run, in parallel with the desktop build. Promotion re-tags those
# exact bits to `:<ga>-<variant>` and `:<X.Y>-<variant>` and verifies the GA
# digest equals the rc digest — the same contract as the CPU manifest. If the
# rc image does not exist (an rc cut before release-docker built GPU images
# on rc tags, or a failed rc GPU job), this job FAILS; it never falls back
# to a rebuild silently, because a silent rebuild publishes bits that were
# never validated and puts a ~2h build back on the GA critical path.
#
# source=build: explicit fallback that rebuilds the variant from the rc
# source ref at GA time (the pre-rc-build behavior). Choose it deliberately.
#
# CUDA is off the GA critical path. Its rc image routinely finishes long
# after every other rc artifact (0.10.105-rc2: build-cuda 99 min, Vulkan
# 41 min, desktop 50 min), so promote-rc-to-ga dispatches this workflow as a
# separate run for CUDA instead of calling it inline. With wait_minutes > 0
# the retag waits for the signed rc image, and stops early when that rc build
# job has already completed without producing one. The gates do not change:
# the exact signed rc digest is re-tagged, never :latest. A CUDA failure here
# touches only :<ga>-cuda / :<X.Y>-cuda and never the published GA.

name: promote-gpu-variant

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: "RC version whose image (retag) or source ref (build) is promoted (no leading v)"
        required: true
        type: string
      ga_tag:
        description: "Clean GA semver used for image tags"
        required: true
        type: string
      variant:
        description: "GPU image variant"
        required: true
        type: choice
        options:
          - cuda
          - vulkan
      move_floating:
        description: "Also move :<X.Y>-<variant> (true for the newest GA; false for an older out-of-band GA)"
        type: boolean
        default: false
      source:
        description: "retag: re-tag the signed rc image. build: explicit fallback that rebuilds from the rc source ref"
        type: choice
        options:
          - retag
          - build
        default: retag
      wait_minutes:
        description: "retag only: minutes to wait for the signed rc image (0 = fail at once if absent; max 210)"
        type: number
        default: 180
  workflow_call:
    inputs:
      rc_tag:
        description: "RC version whose image (retag) or source ref (build) is promoted."
        required: true
        type: string
      ga_tag:
        description: "Clean GA semver used for image tags."
        required: true
        type: string
      variant:
        description: "GPU image variant: cuda or vulkan."
        required: true
        type: string
      move_floating:
        description: "Also move the floating :<X.Y>-<variant> tag (pass push_latest; false for an older out-of-band GA)."
        required: false
        type: boolean
        default: false
      source:
        description: "retag (default): re-tag the rc-built :<rc>-<variant> image. build: rebuild from the rc source ref."
        required: false
        type: string
        default: retag
      wait_minutes:
        description: "retag only: minutes to wait for the signed rc image (0 = fail at once if absent; max 210)."
        required: false
        type: number
        default: 0
    secrets:
      MEM_REPO_TOKEN:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      # Optional compile cache for the source=build fallback (see the build
      # step). Missing values only mean an uncached, slower build.
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      SCCACHE_R2_ACCESS_KEY_ID:
        required: false
      SCCACHE_R2_SECRET_ACCESS_KEY:
        required: false

permissions:
  actions: read     # read the rc release-docker build job while waiting
  contents: read
  id-token: write   # cosign keyless signing for the source=build fallback

jobs:
  retag:
    name: retag-${{ inputs.variant }}
    if: ${{ inputs.source != 'build' }}
    runs-on: ubuntu-latest
    # Covers the maximum wait_minutes (210) plus the re-tag itself.
    timeout-minutes: 240
    env:
      IMAGE: docker.io/nowledgelabs/mem
      RC: ${{ inputs.rc_tag }}
      GA: ${{ inputs.ga_tag }}
      VARIANT: ${{ inputs.variant }}
      SOURCE: ${{ inputs.source }}
      MOVE_FLOATING: ${{ inputs.move_floating }}
      WAIT_MINUTES: ${{ inputs.wait_minutes }}
      POLL_SECONDS: "60"
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SIGNER: '^https://github\.com/${{ github.repository }}/\.github/workflows/(release-docker|release-docker-updater|promote-gpu-variant)\.yml@'
    steps:
      - uses: sigstore/cosign-installer@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Re-tag rc GPU image to GA
        run: |
          set -euo pipefail
          case "$VARIANT" in
            cuda|vulkan) ;;
            *)
              echo "::error::Unsupported GPU variant: $VARIANT"
              exit 1
              ;;
          esac
          if [[ "$SOURCE" != "retag" ]]; then
            echo "::error::Unsupported GPU promotion source: $SOURCE (expected retag or build)"
            exit 1
          fi
          # This workflow can be dispatched directly, so it validates the
          # version pair itself instead of relying on promote-rc-to-ga.
          if ! [[ "$GA" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$RC" == "$GA" ]] || [[ "${RC%%-*}" != "$GA" ]]; then
            echo "::error::rc_tag '$RC' and ga_tag '$GA' must be an rc of that exact clean GA version."
            exit 1
          fi
          WAIT_MINUTES="${WAIT_MINUTES:-0}"
          if ! [[ "$WAIT_MINUTES" =~ ^[0-9]+$ ]] || (( WAIT_MINUTES > 210 )); then
            echo "::error::wait_minutes must be an integer from 0 to 210."
            exit 1
          fi
          SRC="${IMAGE}:${RC}-${VARIANT}"
          MINOR="${GA%.*}"
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' \
              | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])'
          }
          signed() {
            cosign verify "${IMAGE}@$1" \
              --certificate-identity-regexp="$SIGNER" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" >/dev/null
          }
          # Prints the conclusion once the latest rc release-docker run's
          # build job for this variant has completed; prints nothing while it
          # is still running or cannot be read.
          rc_build_conclusion() {
            local run_id
            run_id="$(gh api "repos/${GH_REPO}/actions/workflows/release-docker.yml/runs?branch=v${RC}&per_page=1" \
              --jq '.workflow_runs[0].id // empty' 2>/dev/null)" || return 0
            [[ -n "$run_id" ]] || return 0
            gh api "repos/${GH_REPO}/actions/runs/${run_id}/jobs?per_page=100" \
              --jq ".jobs[] | select(.name == \"build-${VARIANT}\" and .status == \"completed\") | .conclusion" \
              2>/dev/null || true
          }
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          while :; do
            # Read the rc build state before the image: the build job signs
            # before it completes, so a completed job whose signed image is
            # still absent will never produce one.
            BUILD_CONCLUSION=""
            if (( WAIT_MINUTES > 0 )); then
              BUILD_CONCLUSION="$(rc_build_conclusion)"
            fi
            RC_DIGEST="$(digest_of "$SRC" 2>/dev/null)" || RC_DIGEST=""
            if [[ -n "$RC_DIGEST" ]] && signed "$RC_DIGEST"; then
              break
            fi
            if [[ -n "$BUILD_CONCLUSION" ]]; then
              echo "::error::The rc release-docker build-${VARIANT} job completed (${BUILD_CONCLUSION}) without a signed ${SRC}; refusing to promote. GA is unaffected. Re-run that rc job, then dispatch promote-gpu-variant again."
              exit 1
            fi
            if (( $(date +%s) >= deadline )); then
              if [[ -z "$RC_DIGEST" ]]; then
                echo "::error::${SRC} does not exist. release-docker builds GPU images on rc tags; this rc has none (its release-docker build-${VARIANT} job is still running or failed, or the rc predates rc GPU builds). Wait for or re-run that rc job, or re-run promote-rc-to-ga with gpu_source=build and only this variant selected."
              else
                echo "::error::${SRC} (${RC_DIGEST}) has no valid release signature; refusing to promote."
              fi
              exit 1
            fi
            echo "Waiting for a signed ${SRC} (rc build-${VARIANT} still running); next check in ${POLL_SECONDS:-60}s."
            sleep "${POLL_SECONDS:-60}"
          done
          echo "rc ${SRC} digest: ${RC_DIGEST}"
          declare -a TAGS=( "${GA}-${VARIANT}" )
          if [[ "$MOVE_FLOATING" == "true" ]]; then
            TAGS+=( "${MINOR}-${VARIANT}" )
          fi
          declare -a ARGS=()
          for t in "${TAGS[@]}"; do ARGS+=( -t "${IMAGE}:$t" ); done
          docker buildx imagetools create "${ARGS[@]}" "${IMAGE}@${RC_DIGEST}"
          for tag in "${TAGS[@]}"; do
            GA_DIGEST="$(digest_of "${IMAGE}:${tag}")"
            if [[ "$GA_DIGEST" != "$RC_DIGEST" ]]; then
              echo "::error::${IMAGE}:${tag} digest ${GA_DIGEST} != rc digest ${RC_DIGEST}"
              exit 1
            fi
            echo "verified ${IMAGE}:${tag} -> ${GA_DIGEST}"
          done
          {
            echo "### ${VARIANT} image promoted ${RC} -> ${GA} (re-tag, no rebuild)"
            echo "- image: ${IMAGE}:${GA}-${VARIANT} (amd64-only); floating :${MINOR}-${VARIANT} moved: ${MOVE_FLOATING}"
            echo "- digest: ${RC_DIGEST} (identical to ${SRC})"
            echo "- signing: rc signature verified; inherited by digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify image manifest
        run: docker buildx imagetools inspect "${IMAGE}:${GA}-${VARIANT}"

  build:
    name: build-${{ inputs.variant }}
    if: ${{ inputs.source == 'build' }}
    runs-on: ubuntu-latest
    env:
      IMAGE: docker.io/nowledgelabs/mem
      REGISTRY_CACHE_REPO: docker.io/nowledgelabs/mem-buildcache
      LEGACY_RELEASE_RUST_SUBMODULES: "upstream_forks/ladybug upstream_forks/rig"
      RC: ${{ inputs.rc_tag }}
      GA: ${{ inputs.ga_tag }}
      VARIANT: ${{ inputs.variant }}
      MOVE_FLOATING: ${{ inputs.move_floating }}
    steps:
      - name: Validate variant
        run: |
          set -euo pipefail
          case "$VARIANT" in
            cuda|vulkan) ;;
            *)
              echo "::error::Unsupported GPU variant: $VARIANT"
              exit 1
              ;;
          esac
          if ! [[ "$GA" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$RC" == "$GA" ]] || [[ "${RC%%-*}" != "$GA" ]]; then
            echo "::error::rc_tag '$RC' and ga_tag '$GA' must be an rc of that exact clean GA version."
            exit 1
          fi

      - name: Checkout source (rc ref)
        uses: actions/checkout@v4
        with:
          repository: nowledge-co/mem
          token: ${{ secrets.MEM_REPO_TOKEN }}
          ref: v${{ inputs.rc_tag }}
          submodules: false

      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          path: release-tools

      - name: Prepare hosted Docker builder resources
        run: python3 release-tools/scripts/prepare_docker_builder.py --receipt "$RUNNER_TEMP/docker-builder-prepared.json"

      - name: Resolve source commit
        id: sha
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Init Rust fork submodules (https)
        run: |
          git config --global --add safe.directory '*' || true
          if [[ -x scripts/init-release-rust-submodules.sh ]]; then
            scripts/init-release-rust-submodules.sh --init-https
          else
            echo "::warning::Source ref predates the release submodule helper; using the legacy contract."
            read -r -a legacy_submodules <<< "$LEGACY_RELEASE_RUST_SUBMODULES"
            for sm in "${legacy_submodules[@]}"; do
              git config "submodule.$sm.url" "https://github.com/wey-gu/$(basename "$sm").git"
              git submodule update --init --depth 1 "$sm"
            done
          fi

      - name: Prepare exact-source Docker recipes
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ steps.sha.outputs.source_sha }}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 release-tools/scripts/prepare_docker_recipes.py \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/nmem-dockerfiles"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          set -euo pipefail
          MINOR="${GA%.*}"
          if [[ "$MOVE_FLOATING" == "true" ]]; then
            echo "value=${IMAGE}:${GA}-${VARIANT},${IMAGE}:${MINOR}-${VARIANT}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${IMAGE}:${GA}-${VARIANT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push :<ga>-${{ inputs.variant }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ runner.temp }}/nmem-dockerfiles/Dockerfile.rust.${{ inputs.variant }}
          platforms: linux/amd64
          build-args: |
            NMEM_BUILD_SHA_FULL=${{ steps.sha.outputs.source_sha }}
          # Same sccache R2 compile cache and secret contract as
          # release-docker.yml: BuildKit secrets, never build args.
          secrets: |
            sccache_bucket=nowledge-mem-sccache
            sccache_endpoint=https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
            sccache_access_key_id=${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
            sccache_secret_access_key=${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tags.outputs.value }}
          labels: |
            org.opencontainers.image.version=${{ env.GA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.REGISTRY_CACHE_REPO }}:${{ inputs.variant }}-amd64
          cache-to: type=registry,ref=${{ env.REGISTRY_CACHE_REPO }}:${{ inputs.variant }}-amd64,mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign rebuilt GPU image (keyless via OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify image manifest
        run: docker buildx imagetools inspect "${IMAGE}:${GA}-${VARIANT}"

      - name: Summary
        run: |
          {
            echo "### ${VARIANT} image REBUILT for ${GA} (source=build fallback)"
            echo "- source: nowledge-co/mem at v${RC}"
            echo "- image: ${IMAGE}:${GA}-${VARIANT} (amd64-only)"
            echo "- signing: cosign keyless (this rebuild)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record final Docker builder resources
        if: always()
        run: |
          python3 - <<'PYEND'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'release-tools/scripts')
          from prepare_docker_builder import snapshot
          root = Path(os.environ['RUNNER_TEMP'])
          (root / 'docker-builder-final.json').write_text(json.dumps(snapshot(root), indent=2) + '\n')
          PYEND
      - name: Upload Docker builder resource receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-builder-gpu-fallback-${{ inputs.variant }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-builder-*.json
          if-no-files-found: error
