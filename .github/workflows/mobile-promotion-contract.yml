name: mobile-promotion-contract

on:
  pull_request:
    paths:
      - .github/workflows/promote-mobile-to-ga.yml
      - .github/workflows/mobile-promotion-contract.yml
      - scripts/mobile_promotion.py
      - scripts/upload_existing_ipa.py
      - scripts/publish_existing_apk.py
      - scripts/test_mobile_promotion.py
      - scripts/testflight-distribute.py
      - scripts/test_testflight_distribute.py
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-mobile-to-ga.yml
      - .github/workflows/mobile-promotion-contract.yml
      - scripts/mobile_promotion.py
      - scripts/upload_existing_ipa.py
      - scripts/publish_existing_apk.py
      - scripts/test_mobile_promotion.py
      - scripts/testflight-distribute.py
      - scripts/test_testflight_distribute.py

permissions:
  contents: read

jobs:
  contract:
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyjwt cryptography pyyaml
      - run: python -m unittest discover -s scripts -p test_mobile_promotion.py
      - run: python -m unittest discover -s scripts -p test_testflight_distribute.py
