name: docker-builder-memory

on:
  pull_request:
    paths:
      - .github/workflows/docker-builder-memory.yml
      - .github/workflows/release-docker.yml
      - scripts/prepare_docker_builder.py
      - scripts/test_prepare_docker_builder.py
  push:
    branches: [main]
    paths:
      - .github/workflows/docker-builder-memory.yml
      - .github/workflows/release-docker.yml
      - scripts/prepare_docker_builder.py
      - scripts/test_prepare_docker_builder.py
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full already-merged Mem SHA to compile without publishing
        required: true
        type: string

permissions:
  contents: read

jobs:
  resources:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p test_prepare_docker_builder.py -v
      - name: Exercise hosted swap preparation
        run: python3 scripts/prepare_docker_builder.py --receipt "$RUNNER_TEMP/docker-builder-prepared.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-builder-${{ matrix.runner }}
          path: ${{ runner.temp }}/docker-builder-prepared.json
          if-no-files-found: error

  source:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ secrets.MEM_REPO_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          source = os.environ['SOURCE_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', source), 'Expected full source SHA'
          result = json.loads(subprocess.check_output([
              'gh', 'api', f'repos/nowledge-co/mem/compare/{source}...main'], text=True))
          assert result['status'] in ('ahead', 'identical') and result['behind_by'] == 0, 'Source must be merged on main'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={source}\n')
          PY

  compile:
    needs: [resources, source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            recipe: Dockerfile.rust
            cache: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            recipe: Dockerfile.rust
            cache: arm64
          - runner: ubuntu-latest
            platform: linux/amd64
            recipe: Dockerfile.rust.cuda
            cache: cuda-amd64
          - runner: ubuntu-latest
            platform: linux/amd64
            recipe: Dockerfile.rust.vulkan
            cache: vulkan-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: release-tools
      - name: Prepare hosted Docker builder resources
        run: python3 release-tools/scripts/prepare_docker_builder.py --receipt "$RUNNER_TEMP/docker-builder-prepared.json"
      - uses: actions/checkout@v4
        with:
          repository: nowledge-co/mem
          token: ${{ secrets.MEM_REPO_TOKEN }}
          ref: ${{ needs.source.outputs.sha }}
          path: source
          persist-credentials: false
          submodules: false
      - name: Prepare exact source and recipes
        working-directory: source
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          scripts/init-release-rust-submodules.sh --init-https
          python3 ../release-tools/scripts/prepare_docker_recipes.py --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/nmem-dockerfiles"
          sha256sum "$RUNNER_TEMP"/nmem-dockerfiles/* > "$RUNNER_TEMP/docker-recipe-digests.txt"
      - uses: docker/setup-buildx-action@v3
      - name: Compile the exact optimized recipe without image publication
        uses: docker/build-push-action@v6
        with:
          context: source
          file: ${{ runner.temp }}/nmem-dockerfiles/${{ matrix.recipe }}
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=cacheonly
          provenance: false
          sbom: false
          build-args: |
            NMEM_BUILD_SHA_FULL=${{ needs.source.outputs.sha }}
          secrets: |
            sccache_bucket=nowledge-mem-sccache
            sccache_endpoint=https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
            sccache_access_key_id=${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
            sccache_secret_access_key=${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          cache-from: type=registry,ref=docker.io/nowledgelabs/mem-buildcache:${{ matrix.cache }}
      - name: Record final Docker builder resources
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'release-tools/scripts')
          from prepare_docker_builder import snapshot
          root = Path(os.environ['RUNNER_TEMP'])
          (root / 'docker-builder-final.json').write_text(json.dumps(snapshot(root), indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-compile-${{ matrix.cache }}
          path: |
            ${{ runner.temp }}/docker-builder-*.json
            ${{ runner.temp }}/docker-recipe-digests.txt
          if-no-files-found: error
