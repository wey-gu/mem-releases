name: ga-promotion-contract

on:
  pull_request:
    paths:
      - .github/workflows/promote-rc-to-ga.yml
      - .github/workflows/finish-ga-release.yml
      - .github/workflows/release-desktop.yml
      - .github/workflows/ga-promotion-contract.yml
      - scripts/test_ga_promotion_contract.py
      - scripts/verify-ga-delivery.mjs
      - scripts/test_verify_ga_delivery.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-rc-to-ga.yml
      - .github/workflows/finish-ga-release.yml
      - .github/workflows/release-desktop.yml
      - .github/workflows/ga-promotion-contract.yml
      - scripts/test_ga_promotion_contract.py
      - scripts/verify-ga-delivery.mjs
      - scripts/test_verify_ga_delivery.mjs

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check GA promotion boundary
        run: python3 -m unittest discover -s scripts -p test_ga_promotion_contract.py
      - name: Check exact GA delivery gate
        run: node --test scripts/test_verify_ga_delivery.mjs
