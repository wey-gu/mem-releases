name: ga-promotion-contract

on:
  pull_request:
    paths:
      - .github/workflows/promote-rc-to-ga.yml
      - .github/workflows/promote-gpu-variant.yml
      - .github/workflows/release-docker.yml
      - .github/workflows/finish-ga-release.yml
      - .github/workflows/release-desktop.yml
      - .github/workflows/release-docker-updater.yml
      - .github/workflows/test-windows-bazel.yml
      - .github/workflows/build-rust-bundle.yml
      - .github/workflows/promote-rpm-to-ga.yml
      - .github/workflows/promote-apt-to-ga.yml
      - .github/workflows/open-apt-pause-route.yml
      - .github/workflows/ga-promotion-contract.yml
      - scripts/select-windows-runner.mjs
      - scripts/test_select_windows_runner.mjs
      - scripts/test_ga_promotion_contract.py
      - scripts/verify-ga-delivery.mjs
      - scripts/test_verify_ga_delivery.mjs
      - scripts/verify-upgrade-pause.mjs
      - scripts/test_verify_upgrade_pause.mjs
      - scripts/open-apt-pause-route.mjs
      - scripts/test_open_apt_pause_route.mjs
      - scripts/build-desktop-update-manifest.mjs
      - scripts/desktop-update-operator-worker.mjs
      - scripts/invoke-desktop-update-operator.mjs
      - scripts/test_desktop_update_operator.mjs
      - wrangler.desktop-update-operator.jsonc
      - .github/workflows/desktop-update-control.yml
      - .github/workflows/remove-desktop-upgrade-pause.yml
      - scripts/remove-desktop-pause-routes.mjs
      - scripts/test_remove_desktop_pause_routes.mjs
      - scripts/verify-controlled-desktop-update.mjs
      - scripts/test_verify_controlled_desktop_update.mjs
      - scripts/upload-draft-release-assets.mjs
      - scripts/test_upload_draft_release_assets.mjs
      - scripts/assert-fresh-r2-version.mjs
      - scripts/test_assert_fresh_r2_version.mjs
      - scripts/rpm-ga-policy.mjs
      - scripts/test_rpm_ga_policy.mjs
      - scripts/reconcile-rpm-release-asset.mjs
      - scripts/test_reconcile_rpm_release_asset.mjs
      - scripts/reconcile-rpm-r2.mjs
      - scripts/test_reconcile_rpm_r2.mjs
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-rc-to-ga.yml
      - .github/workflows/promote-gpu-variant.yml
      - .github/workflows/release-docker.yml
      - .github/workflows/finish-ga-release.yml
      - .github/workflows/release-desktop.yml
      - .github/workflows/release-docker-updater.yml
      - .github/workflows/test-windows-bazel.yml
      - .github/workflows/build-rust-bundle.yml
      - .github/workflows/promote-rpm-to-ga.yml
      - .github/workflows/promote-apt-to-ga.yml
      - .github/workflows/open-apt-pause-route.yml
      - .github/workflows/ga-promotion-contract.yml
      - scripts/select-windows-runner.mjs
      - scripts/test_select_windows_runner.mjs
      - scripts/test_ga_promotion_contract.py
      - scripts/verify-ga-delivery.mjs
      - scripts/test_verify_ga_delivery.mjs
      - scripts/verify-upgrade-pause.mjs
      - scripts/test_verify_upgrade_pause.mjs
      - scripts/open-apt-pause-route.mjs
      - scripts/test_open_apt_pause_route.mjs
      - scripts/build-desktop-update-manifest.mjs
      - scripts/desktop-update-operator-worker.mjs
      - scripts/invoke-desktop-update-operator.mjs
      - scripts/test_desktop_update_operator.mjs
      - wrangler.desktop-update-operator.jsonc
      - .github/workflows/desktop-update-control.yml
      - .github/workflows/remove-desktop-upgrade-pause.yml
      - scripts/remove-desktop-pause-routes.mjs
      - scripts/test_remove_desktop_pause_routes.mjs
      - scripts/verify-controlled-desktop-update.mjs
      - scripts/test_verify_controlled_desktop_update.mjs
      - scripts/upload-draft-release-assets.mjs
      - scripts/test_upload_draft_release_assets.mjs
      - scripts/assert-fresh-r2-version.mjs
      - scripts/test_assert_fresh_r2_version.mjs
      - scripts/rpm-ga-policy.mjs
      - scripts/test_rpm_ga_policy.mjs
      - scripts/reconcile-rpm-release-asset.mjs
      - scripts/test_reconcile_rpm_release_asset.mjs
      - scripts/reconcile-rpm-r2.mjs
      - scripts/test_reconcile_rpm_r2.mjs
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check GA promotion boundary
        run: python3 -m unittest discover -s scripts -p test_ga_promotion_contract.py
      - name: Check exact GA delivery gate
        run: node --test scripts/test_verify_ga_delivery.mjs scripts/test_verify_upgrade_pause.mjs scripts/test_open_apt_pause_route.mjs scripts/test_desktop_update_operator.mjs scripts/test_remove_desktop_pause_routes.mjs scripts/test_verify_controlled_desktop_update.mjs
      - name: Check draft Release asset reconciliation
        run: node --test scripts/test_upload_draft_release_assets.mjs
      - name: Check fresh R2 version gate
        run: node --test scripts/test_assert_fresh_r2_version.mjs
      - name: Check deferred RPM promotion
        run: node --test scripts/test_rpm_ga_policy.mjs scripts/test_reconcile_rpm_release_asset.mjs scripts/test_reconcile_rpm_r2.mjs
      - name: Check Windows runner selection and fallback
        run: node --test scripts/test_select_windows_runner.mjs
