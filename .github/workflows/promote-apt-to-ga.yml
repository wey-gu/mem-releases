# Publish APT only after a pause-aware core GA has been staged. Operators first
# remove only the APT pause route; Desktop latest and update routes stay paused.
name: promote-apt-to-ga

on:
  workflow_dispatch:
    inputs:
      ga_tag:
        description: "Existing draft GA version to publish to APT (e.g. 0.10.101; clean semver)"
        required: true
        type: string
      paused_stable_version:
        description: "Previous stable Desktop version used for native pause probes"
        required: true
        type: string

concurrency:
  group: promote-apt-${{ inputs.ga_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-22.04
    environment: release-publish
    timeout-minutes: 45
    env:
      GA: ${{ inputs.ga_tag }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      VERIFY_PLATFORMS: mac,mac-intel,win,linux,linux-deb,linux-appimage
      VERIFY_PREVIOUS_DESKTOP_VERSION: ${{ inputs.paused_stable_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate the staged GA and open APT boundary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$GA" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::GA tag '$GA' must be clean semver."
            exit 1
          }
          [[ "$VERIFY_PREVIOUS_DESKTOP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$VERIFY_PREVIOUS_DESKTOP_VERSION" != "$GA" ]] || {
            echo "::error::paused_stable_version must be a clean semver different from GA."
            exit 1
          }
          [[ -n "$GPG_PRIVATE_KEY" ]] || {
            echo "::error::GPG_PRIVATE_KEY is required for APT publication."
            exit 1
          }
          release="$(gh release view "v${GA}" --repo "$REPO" --json isDraft,assets)"
          [[ "$(jq -r '.isDraft' <<<"$release")" == "true" ]] || {
            echo "::error::v${GA} must exist as a draft GA release."
            exit 1
          }
          [[ "$(jq '[.assets[].name | select(test("\\.deb$"))] | length' <<<"$release")" == "1" ]] || {
            echo "::error::v${GA} must contain exactly one DEB asset."
            exit 1
          }
          node scripts/verify-upgrade-pause.mjs --desktop-only
          VERIFY_RELEASE_VERSION="$GA" node scripts/verify-ga-delivery.mjs --apt-preflight

      - name: Clone mem-backbone (private)
        env:
          PAT: ${{ secrets.MEM_BACKBONE_PAT }}
        run: |
          set -euo pipefail
          AUTH_B64="$(printf 'x-access-token:%s' "$PAT" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=Authorization: Basic ${AUTH_B64}" \
              clone --depth=1 https://github.com/nowledge-co/mem-backbone.git mem-backbone
          git -C mem-backbone config --unset-all http.https://github.com/.extraheader || true

      - name: Install APT publication dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gnupg dpkg-dev gzip
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix mem-backbone --no-audit --no-fund

      - name: Download and authenticate the staged GA DEB
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir ga-artifacts
          gh release download "v${GA}" --repo "$REPO" --dir ga-artifacts --pattern '*.deb'
          mapfile -t debs < <(find ga-artifacts -maxdepth 1 -type f -name '*.deb' -print)
          [[ "${#debs[@]}" == "1" ]] || {
            echo "::error::Expected exactly one downloaded DEB; found ${#debs[@]}."
            exit 1
          }
          deb="${debs[0]}"
          source_name="$(basename "$deb")"
          source_digest="$(gh release view "v${GA}" --repo "$REPO" --json assets --jq \
            ".assets[] | select(.name == \"${source_name}\") | .digest")"
          local_digest="sha256:$(sha256sum "$deb" | awk '{print $1}')"
          [[ "$source_digest" == "$local_digest" ]] || {
            echo "::error::Downloaded GA DEB differs from the draft Release asset digest."
            exit 1
          }
          echo "DEB=$PWD/$deb" >> "$GITHUB_ENV"

      - name: Import GPG signing key
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "use-agent" >> ~/.gnupg/gpg.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true

      - name: Publish the exact GA DEB to APT
        working-directory: mem-backbone
        run: node scripts/update-apt-repo.cjs "$GA" "$DEB"

      - name: Verify exact APT delivery
        run: VERIFY_RELEASE_VERSION="$GA" node scripts/verify-ga-delivery.mjs --apt-only

      - name: Summary
        run: |
          {
            echo "### APT promoted to ${GA}"
            echo "- Source: authenticated DEB from draft GA release v${GA}"
            echo "- Desktop latest/update pause: retained and reverified before publication"
            echo "- APT Packages: exact ${GA} verified"
          } >> "$GITHUB_STEP_SUMMARY"
