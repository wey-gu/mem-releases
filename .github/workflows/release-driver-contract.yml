name: release-driver-contract

on:
  pull_request:
    paths:
      - scripts/release_driver.py
      - scripts/test_release_driver.py
      - .github/workflows/release-driver-contract.yml
  push:
    branches: [main]
    paths:
      - scripts/release_driver.py
      - scripts/test_release_driver.py
      - .github/workflows/release-driver-contract.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest scripts.test_release_driver -v
