# Dispatches the side-effect-free nightly release-shape build
# (release-desktop.yml with `tag: nightly`) for nowledge-co/mem main.
# nowledge-co/mem#7108, W5 + W17.
#
# This repository cannot see pushes to nowledge-co/mem, so an hourly poll
# decides. It dispatches a nightly for main's current commit when:
#   - dependencies: main's dependency fingerprint has not been built yet. The
#     fingerprint covers every Cargo.toml / *Cargo.lock in the tree (including
#     integrations/hawdb/*-Cargo.lock and the bazel-Cargo.* manifests) and the
#     hawdb + upstream_forks/* gitlinks, which are compiled into nmem-server
#     without moving Cargo.lock. It also covers the files that change the
#     compiler flags of every crate without touching a manifest: the
#     toolchain, .cargo/config.toml, the shipped server manifest generator
#     (integrations/hawdb/prepare-nightly-server.py) and build-rust-bundle.
#     W14's `strip = "symbols"` there invalidated every cached crate once
#     (Rust hit rate 98% -> 37%, macOS +100 min). On 0.10.101-rc1,
#     dependency bumps compiled cold inside the release (Windows +50,
#     macOS +43, Linux +52 min against a warm rc). Building them right
#     after they merge warms sccache and the Bazel remote cache before the
#     next rc;
#   - daily: no nightly has been dispatched since 18:00 UTC today (02:00
#     Beijing), so source-only breakage still surfaces within a day;
#   - manual: workflow_dispatch with force=true.
# It never dispatches while any release-desktop run is queued or running. That
# run is a release, or a nightly that already covers this. The next poll
# retries, because markers are saved only when a nightly is dispatched.
#
# "Already built" markers are tiny Actions cache entries
# (release-shape-deps-<fingerprint>, release-shape-day-<date>) saved by the
# run on main. If one is evicted, the worst case is one extra nightly.

name: release-shape-nightly

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Dispatch a nightly for main now, even if this fingerprint was built (still skips while a release runs)."
        required: false
        type: boolean
        default: false

concurrency:
  group: release-shape-nightly
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  decide:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      # Blobless and sparse: only trees (for `git ls-tree`) and one file are
      # fetched, so this stays a few MB as the source tree grows.
      - name: Fetch nowledge-co/mem main (trees only)
        uses: actions/checkout@v4
        with:
          repository: nowledge-co/mem
          token: ${{ secrets.MEM_REPO_TOKEN }}
          ref: main
          path: mem
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: nowledge-graph/package.json
          sparse-checkout-cone-mode: false
          submodules: false
          persist-credentials: false

      - name: Compute the dependency fingerprint
        id: fingerprint
        run: |
          set -euo pipefail
          sha="$(git -C mem rev-parse HEAD)"
          listing="$(git -C mem ls-tree -r HEAD | awk -F '\t' '
            $2 ~ /Cargo\.(toml|lock)$/ || $2 == "hawdb" || $2 ~ /^upstream_forks\/[^\/]+$/ { print; next }
            $2 ~ /(^|\/)rust-toolchain(\.toml)?$/ || $2 ~ /(^|\/)\.cargo\/config(\.toml)?$/ { print; next }
            $2 == "integrations/hawdb/prepare-nightly-server.py" { print; next }
            $2 ~ /^nowledge-graph\/scripts\/build-rust-bundle\.(sh|ps1)$/ { print }
          ' | LC_ALL=C sort)"
          if [[ -z "$listing" ]]; then
            echo "::error::No Cargo manifests found in nowledge-co/mem@${sha}; refusing an empty fingerprint."
            exit 1
          fi
          deps="$(sha256sum <<<"$listing" | cut -c1-20)"
          {
            echo "sha=$sha"
            echo "deps=$deps"
            echo "day=$(date -u +%Y%m%d)"
            echo "after_daily_slot=$([[ "$(date -u +%H)" -ge 18 ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "nowledge-co/mem@${sha}: $(wc -l <<<"$listing") dependency entries, fingerprint ${deps}"

      - name: Was this dependency fingerprint built already?
        id: deps_seen
        uses: actions/cache/restore@v4
        with:
          path: .release-shape-marker
          key: release-shape-deps-${{ steps.fingerprint.outputs.deps }}
          lookup-only: true

      - name: Was today's daily nightly dispatched already?
        id: day_seen
        uses: actions/cache/restore@v4
        with:
          path: .release-shape-marker
          key: release-shape-day-${{ steps.fingerprint.outputs.day }}
          lookup-only: true

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          DEPS_SEEN: ${{ steps.deps_seen.outputs.cache-hit }}
          DAY_SEEN: ${{ steps.day_seen.outputs.cache-hit }}
          AFTER_DAILY_SLOT: ${{ steps.fingerprint.outputs.after_daily_slot }}
        run: |
          set -euo pipefail
          reason=""
          if [[ "$FORCE" == "true" ]]; then
            reason="manual"
          elif [[ "$DEPS_SEEN" != "true" ]]; then
            reason="dependencies"
          elif [[ "$AFTER_DAILY_SLOT" == "true" && "$DAY_SEEN" != "true" ]]; then
            reason="daily"
          fi
          if [[ -z "$reason" ]]; then
            echo "Nothing to build: fingerprint already built and today's nightly already dispatched."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail closed here: if the run list is unavailable, do not risk
          # competing with a release; the next poll retries.
          runs="$(gh run list -R "$GITHUB_REPOSITORY" --workflow release-desktop.yml \
            --limit 100 --json databaseId,status)"
          active="$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")"
          if (( active > 0 )); then
            echo "::notice::Deferred (${reason}): ${active} release-desktop run(s) in flight; the next poll retries."
            echo "Deferred (${reason}): ${active} release-desktop run(s) in flight." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Prepare marker
        if: steps.decide.outputs.build == 'true'
        env:
          SOURCE_SHA: ${{ steps.fingerprint.outputs.sha }}
        run: echo "$SOURCE_SHA" > .release-shape-marker

      - name: Mark this dependency fingerprint as built
        if: steps.decide.outputs.build == 'true' && steps.deps_seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .release-shape-marker
          key: release-shape-deps-${{ steps.fingerprint.outputs.deps }}

      - name: Mark today's daily nightly as dispatched
        if: steps.decide.outputs.build == 'true' && steps.fingerprint.outputs.after_daily_slot == 'true' && steps.day_seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .release-shape-marker
          key: release-shape-day-${{ steps.fingerprint.outputs.day }}

      - name: Dispatch the nightly release-shape build
        if: steps.decide.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.fingerprint.outputs.sha }}
          REASON: ${{ steps.decide.outputs.reason }}
          DEPS: ${{ steps.fingerprint.outputs.deps }}
        run: |
          set -euo pipefail
          gh workflow run release-desktop.yml -R "$GITHUB_REPOSITORY" --ref main \
            -f tag=nightly -f source_ref="$SOURCE_SHA"
          echo "Dispatched nightly release-shape build (${REASON}) for nowledge-co/mem@${SOURCE_SHA}, fingerprint ${DEPS}." \
            | tee -a "$GITHUB_STEP_SUMMARY"
