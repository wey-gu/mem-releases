# Build, sign, and publish the official headless Docker image.
#
# Source code is fetched at build time from the private source repo via
# MEM_REPO_TOKEN (fine-grained PAT, Contents: Read only).
#
# Trigger: manual (workflow_dispatch) or pushing a tag matching `v*` on
# THIS repo. Tags suffixed with `-ci*` / `-rpmtest*` are excluded so the
# desktop iteration workflows don't double-spend on docker builds.
#
# Per-arch builds run on native runners (no QEMU emulation):
#   linux/amd64 → ubuntu-latest
#   linux/arm64 → ubuntu-24.04-arm
# Each emits a digest; a third job merges them into one multi-arch manifest,
# cosign-signs the manifest by digest, and verifies via a smoke-test pull.

name: release-docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Source tag to build (e.g. 0.8.4 or 0.8.4-rc2). Must match pyproject.toml base version on the source ref."
        required: true
        type: string
      latest:
        description: "Also push :latest"
        required: false
        type: boolean
        default: true
  push:
    # Auto-fire on RC-style tags ONLY (anything with a `-` suffix:
    # `-rcN`, `-betaN`, `-ciN`). Clean-semver GA tags like `v0.8.4`
    # must NOT auto-fire — they are created as a side-effect when a
    # GH Release draft is published on this repo, which would
    # otherwise kick off a redundant full rebuild that overwrites the
    # promoted manifest (seen on 0.8.4: publishing the draft re-built
    # the docker image and clobbered the rc7-promoted digest). GA
    # publishes go through `promote-rc-to-ga.yml` (manifest re-tag,
    # no rebuild) or explicit `workflow_dispatch` when a real rebuild
    # is wanted.
    tags:
      - "v*-*"
      - "!v*-ci*"
      - "!v*-rpmtest*"

concurrency:
  group: release-docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required by cosign keyless OIDC signing
  packages: read

env:
  IMAGE: docker.io/nowledgelabs/mem
  REGISTRY_CACHE_REPO: docker.io/nowledgelabs/mem-buildcache
  LEGACY_RELEASE_RUST_SUBMODULES: "upstream_forks/ladybug upstream_forks/rig"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      source_ref: ${{ steps.v.outputs.source_ref }}
      source_sha: ${{ steps.sha.outputs.source_sha }}
      push_latest: ${{ steps.v.outputs.push_latest }}
      is_prerelease: ${{ steps.v.outputs.is_prerelease }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.tag }}"
            SOURCE_REF="v${VERSION}"
            PUSH_LATEST="${{ inputs.latest }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            SOURCE_REF="$GITHUB_REF_NAME"
            PUSH_LATEST="true"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$ ]]; then
            echo "Refusing to publish: version '$VERSION' is not semver-ish." >&2
            exit 1
          fi
          # Pre-release tags must NOT mark :latest.
          IS_PRERELEASE="false"
          if [[ "$VERSION" == *-* || "$VERSION" == *.dev* ]]; then
            PUSH_LATEST="false"
            IS_PRERELEASE="true"
          fi
          {
            echo "version=$VERSION"
            echo "source_ref=$SOURCE_REF"
            echo "push_latest=$PUSH_LATEST"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      # Resolve the source commit once, so both arch builds bake the same
      # build-provenance sha into nmem-server (the build context has no .git).
      # See docs/implementation/BUILD_PROVENANCE_AND_CACHE_INTEGRITY.md.
      - name: Resolve source commit
        uses: actions/checkout@v4
        with:
          repository: nowledge-co/mem
          token: ${{ secrets.MEM_REPO_TOKEN }}
          ref: ${{ steps.v.outputs.source_ref }}
          submodules: false
          fetch-depth: 1
      - id: sha
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: nowledge-co/mem
          token: ${{ secrets.MEM_REPO_TOKEN }}
          ref: ${{ needs.meta.outputs.source_ref }}
          submodules: false

      - &checkout_release_tooling
        name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          path: release-tools

      - &prepare_docker_builder
        name: Prepare hosted Docker builder resources
        run: python3 release-tools/scripts/prepare_docker_builder.py --receipt "$RUNNER_TEMP/docker-builder-prepared.json"

      # Prefer the source-owned release contract. The fallback keeps historical
      # source tags, which predate the helper, reproducibly buildable.
      - name: Init Rust fork submodules (https)
        run: |
          git config --global --add safe.directory '*' || true
          if [[ -x scripts/init-release-rust-submodules.sh ]]; then
            scripts/init-release-rust-submodules.sh --init-https
          else
            echo "::warning::Source ref predates the release submodule helper; using the legacy contract."
            read -r -a legacy_submodules <<< "$LEGACY_RELEASE_RUST_SUBMODULES"
            for sm in "${legacy_submodules[@]}"; do
              git config "submodule.$sm.url" "https://github.com/wey-gu/$(basename "$sm").git"
              git submodule update --init --depth 1 "$sm"
            done
          fi

      - &prepare_docker_recipes
        name: Prepare exact-source Docker recipes
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.meta.outputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 release-tools/scripts/prepare_docker_recipes.py \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/nmem-dockerfiles"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ runner.temp }}/nmem-dockerfiles/Dockerfile.rust
          platforms: linux/amd64
          build-args: |
            NMEM_BUILD_SHA_FULL=${{ needs.meta.outputs.source_sha }}
          # Rust/C++ compile cache: the same sccache R2 bucket release-desktop
          # uses. The registry layer cache cannot help the cargo step (the source
          # COPY busts it on every release), so without this every rc compiled
          # the whole dependency graph from scratch. Passed as BuildKit secrets,
          # never build args: secrets stay out of image layers and out of the
          # mode=max provenance, and do not affect layer cache keys. Source refs
          # whose Dockerfile predates `with-sccache` ignore them and build
          # uncached, exactly as before.
          secrets: &sccache_secrets |
            sccache_bucket=nowledge-mem-sccache
            sccache_endpoint=https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
            sccache_access_key_id=${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
            sccache_secret_access_key=${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          push: true
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.REGISTRY_CACHE_REPO }}:amd64
          cache-to: type=registry,ref=${{ env.REGISTRY_CACHE_REPO }}:amd64,mode=max

      - &record_docker_resources
        name: Record final Docker builder resources
        if: always()
        run: |
          python3 - <<'PYEND'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'release-tools/scripts')
          from prepare_docker_builder import snapshot
          root = Path(os.environ['RUNNER_TEMP'])
          (root / 'docker-builder-final.json').write_text(json.dumps(snapshot(root), indent=2) + '\n')
          PYEND
      - &upload_docker_resources
        name: Upload Docker builder resource receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-builder-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-builder-*.json
          if-no-files-found: error

  build-arm64:
    needs: meta
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: nowledge-co/mem
          token: ${{ secrets.MEM_REPO_TOKEN }}
          ref: ${{ needs.meta.outputs.source_ref }}
          submodules: false

      - *checkout_release_tooling
      - *prepare_docker_builder

      # Prefer the source-owned release contract. The fallback keeps historical
      # source tags, which predate the helper, reproducibly buildable.
      - name: Init Rust fork submodules (https)
        run: |
          git config --global --add safe.directory '*' || true
          if [[ -x scripts/init-release-rust-submodules.sh ]]; then
            scripts/init-release-rust-submodules.sh --init-https
          else
            echo "::warning::Source ref predates the release submodule helper; using the legacy contract."
            read -r -a legacy_submodules <<< "$LEGACY_RELEASE_RUST_SUBMODULES"
            for sm in "${legacy_submodules[@]}"; do
              git config "submodule.$sm.url" "https://github.com/wey-gu/$(basename "$sm").git"
              git submodule update --init --depth 1 "$sm"
            done
          fi

      - *prepare_docker_recipes

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ runner.temp }}/nmem-dockerfiles/Dockerfile.rust
          platforms: linux/arm64
          build-args: |
            NMEM_BUILD_SHA_FULL=${{ needs.meta.outputs.source_sha }}
          secrets: *sccache_secrets
          push: true
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.REGISTRY_CACHE_REPO }}:arm64
          cache-to: type=registry,ref=${{ env.REGISTRY_CACHE_REPO }}:arm64,mode=max

  # Opt-in GPU image, published as a STANDALONE single-arch tag `:<ver>-cuda`
  # (amd64 only — CUDA is x86). Independent of the multi-arch default image and
  # its `publish` manifest job, so it never blocks or alters the CPU release. The
  # binary's runtime auto-detects the GPU and falls back to CPU, so the image is
  # usable without --gpus, just slower.
  #
  # Runs on rc tags too, in parallel with the desktop build, so GA promotion
  # re-tags `:<rc>-cuda` instead of rebuilding it (promote-gpu-variant.yml).
  # A pre-release pushes ONLY the exact rc-scoped tag `:<rc>-cuda`; the
  # floating `:<X.Y>-cuda` tag moves only for a clean GA version. GPU images
  # are never `:latest`.
      - *record_docker_resources
      - *upload_docker_resources

  build-cuda:
    needs: meta
    runs-on: ubuntu-latest
    env:
      VARIANT: cuda
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: nowledge-co/mem
          token: ${{ secrets.MEM_REPO_TOKEN }}
          ref: ${{ needs.meta.outputs.source_ref }}
          submodules: false

      - *checkout_release_tooling
      - *prepare_docker_builder
      - name: Init Rust fork submodules (https)
        run: |
          git config --global --add safe.directory '*' || true
          if [[ -x scripts/init-release-rust-submodules.sh ]]; then
            scripts/init-release-rust-submodules.sh --init-https
          else
            echo "::warning::Source ref predates the release submodule helper; using the legacy contract."
            read -r -a legacy_submodules <<< "$LEGACY_RELEASE_RUST_SUBMODULES"
            for sm in "${legacy_submodules[@]}"; do
              git config "submodule.$sm.url" "https://github.com/wey-gu/$(basename "$sm").git"
              git submodule update --init --depth 1 "$sm"
            done
          fi
      - *prepare_docker_recipes

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - &gpu_tags
        name: Resolve GPU image tags
        id: tags
        env:
          V: ${{ needs.meta.outputs.version }}
          PUSH_LATEST: ${{ needs.meta.outputs.push_latest }}
        run: |
          set -euo pipefail
          # GPU images are never :latest (amd64-only + GPU is opt-in). A
          # pre-release version already carries a dash (0.10.0-rc1 ->
          # 0.10.0-rc1-cuda). Only a GA allowed to move :latest moves the floating
          # :<X.Y>-<variant>; `${V%.*}` of an rc is the GA minor line (0.10).
          if [[ "$PUSH_LATEST" == "true" ]]; then
            MINOR="${V%.*}"
            echo "list=${IMAGE}:${V}-${VARIANT},${IMAGE}:${MINOR}-${VARIANT}" >> "$GITHUB_OUTPUT"
          else
            echo "list=${IMAGE}:${V}-${VARIANT}" >> "$GITHUB_OUTPUT"
          fi
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ runner.temp }}/nmem-dockerfiles/Dockerfile.rust.cuda
          platforms: linux/amd64
          build-args: |
            NMEM_BUILD_SHA_FULL=${{ needs.meta.outputs.source_sha }}
          secrets: *sccache_secrets
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.REGISTRY_CACHE_REPO }}:cuda-amd64
          cache-to: type=registry,ref=${{ env.REGISTRY_CACHE_REPO }}:cuda-amd64,mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign GPU image (keyless via OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Sign the digest at build time, like the CPU manifest. GA promotion
          # re-tags this same digest and verifies this signature first.
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - *record_docker_resources
      - *upload_docker_resources

  build-vulkan:
    needs: meta
    # Vulkan GPU image (AMD/Intel via Mesa, NVIDIA via the Vulkan ICD). Same
    # schedule and tag policy as :cuda — built on rc tags so GA promotion is a
    # re-tag. Independent of the CPU publish/manifest job (separate
    # :<ver>-vulkan tag, never folded into :latest).
    runs-on: ubuntu-latest
    env:
      VARIANT: vulkan
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: nowledge-co/mem
          token: ${{ secrets.MEM_REPO_TOKEN }}
          ref: ${{ needs.meta.outputs.source_ref }}
          submodules: false

      - *checkout_release_tooling
      - *prepare_docker_builder
      - name: Init Rust fork submodules (https)
        run: |
          git config --global --add safe.directory '*' || true
          if [[ -x scripts/init-release-rust-submodules.sh ]]; then
            scripts/init-release-rust-submodules.sh --init-https
          else
            echo "::warning::Source ref predates the release submodule helper; using the legacy contract."
            read -r -a legacy_submodules <<< "$LEGACY_RELEASE_RUST_SUBMODULES"
            for sm in "${legacy_submodules[@]}"; do
              git config "submodule.$sm.url" "https://github.com/wey-gu/$(basename "$sm").git"
              git submodule update --init --depth 1 "$sm"
            done
          fi
      - *prepare_docker_recipes

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - *gpu_tags
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ runner.temp }}/nmem-dockerfiles/Dockerfile.rust.vulkan
          platforms: linux/amd64
          build-args: |
            NMEM_BUILD_SHA_FULL=${{ needs.meta.outputs.source_sha }}
          secrets: *sccache_secrets
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.REGISTRY_CACHE_REPO }}:vulkan-amd64
          cache-to: type=registry,ref=${{ env.REGISTRY_CACHE_REPO }}:vulkan-amd64,mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign GPU image (keyless via OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Sign the digest at build time, like the CPU manifest. GA promotion
          # re-tags this same digest and verifies this signature first.
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - *record_docker_resources
      - *upload_docker_resources

  publish:
    needs: [meta, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: tags
        run: |
          set -euo pipefail
          V="${{ needs.meta.outputs.version }}"
          MINOR="${V%.*}"
          # Floating tags (:latest, :X.Y) are GA pointers. Only a GA that is
          # allowed to move :latest moves them; an rc (push_latest forced
          # false in meta) or an older out-of-band GA pushes only its own
          # immutable :<version>. `${V%.*}` of 0.10.80-rc1 is 0.10, so without
          # this gate every rc moved :0.10.
          {
            echo "primary=${IMAGE}:${V}"
            if [[ "${{ needs.meta.outputs.push_latest }}" == "true" ]]; then
              echo "minor=${IMAGE}:${MINOR}"
              echo "latest=${IMAGE}:latest"
            else
              echo "minor="
              echo "latest="
            fi
          } >> "$GITHUB_OUTPUT"

      - id: manifest
        run: |
          set -euo pipefail
          AMD="${IMAGE}@${{ needs.build-amd64.outputs.digest }}"
          ARM="${IMAGE}@${{ needs.build-arm64.outputs.digest }}"
          declare -a TAGS=(
            "${{ steps.tags.outputs.primary }}"
          )
          if [[ -n "${{ steps.tags.outputs.minor }}" ]]; then
            TAGS+=( "${{ steps.tags.outputs.minor }}" )
          fi
          if [[ -n "${{ steps.tags.outputs.latest }}" ]]; then
            TAGS+=( "${{ steps.tags.outputs.latest }}" )
          fi
          docker buildx imagetools create \
            $(for t in "${TAGS[@]}"; do echo -n " -t $t"; done) \
            "$AMD" "$ARM"
          DIGEST=$(docker buildx imagetools inspect "${{ steps.tags.outputs.primary }}" --format '{{json .Manifest}}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published manifest digest: $DIGEST"

      - uses: sigstore/cosign-installer@v3

      - name: Sign manifest (keyless via OIDC)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

  verify:
    needs: [meta, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # The scriptable rc smoke probe, from the exact commit the image was
      # built from. Only this one file: the verify job needs no build tree.
      - name: Fetch the release smoke probe
        uses: actions/checkout@v4
        with:
          repository: nowledge-co/mem
          token: ${{ secrets.MEM_REPO_TOKEN }}
          ref: ${{ needs.meta.outputs.source_sha }}
          path: mem-src
          fetch-depth: 1
          sparse-checkout: scripts/release_smoke_probe.py
          sparse-checkout-cone-mode: false

      - name: Pull and smoke-test
        env:
          TAG: ${{ needs.meta.outputs.version }}
          SOURCE_SHA: ${{ needs.meta.outputs.source_sha }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE}:${TAG}"
          # CI owns this disposable container and does not expose it beyond
          # localhost. Disable LAN auth so the verifier can inspect the
          # protected readiness/build-details endpoint without parsing the
          # auto-generated key from container logs.
          CID=$(docker run -d -p 127.0.0.1:14242:14242 -e NMEM_LAN_AUTH=disabled "${IMAGE}:${TAG}")
          trap "docker logs $CID || true; docker rm -f $CID || true" EXIT

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:14242/livez >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:14242/livez

          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:14242/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          HEALTH=$(curl -fsS http://127.0.0.1:14242/health)
          echo "$HEALTH"
          echo "$HEALTH" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          if d != {"status": "ok"}:
              raise AssertionError(f"unexpected public health payload: {d!r}")
          print("public health contract OK: status-only")
          '

          DETAILS=$(curl -fsS http://127.0.0.1:14242/health/details)
          echo "$DETAILS"
          echo "$DETAILS" | TAG="$TAG" python3 -c '
          import json, os, re, sys
          d = json.load(sys.stdin)
          v = d.get("version") or ""
          t = os.environ["TAG"]
          if t == v or re.match(rf"^{re.escape(v)}[.\-]", t):
              print(f"version OK: binary={v} tag={t}")
          else:
              raise AssertionError(f"version mismatch: binary={v} tag={t}")
          '

          # Scriptable rc smoke: build_sha, write, read back, lexical search,
          # negative control, then restart the container and read back again.
          # Isolation is the container itself: freshly created, no host bind
          # mounts (asserted), so it can only see its own empty data volume.
          PROBE=mem-src/scripts/release_smoke_probe.py
          if [[ ! -f "$PROBE" ]]; then
            echo "::warning title=Release smoke skipped::The source commit predates scripts/release_smoke_probe.py; smoke this image by hand before promoting."
            exit 0
          fi
          BINDS=$(docker inspect --format '{{range .Mounts}}{{if eq .Type "bind"}}{{.Source}} {{end}}{{end}}' "$CID")
          if [[ -n "$BINDS" ]]; then
            echo "::error::smoke container has host bind mounts ($BINDS); refusing to write test data"
            exit 1
          fi
          probe() {
            python3 "$PROBE" "$1" --base-url http://127.0.0.1:14242 \
              --expect-version "$TAG" --expect-sha "$SOURCE_SHA" \
              --state "$RUNNER_TEMP/smoke-state.json"
          }
          probe write || { echo "::error::release smoke failed (write phase); this image is not promotable"; exit 1; }
          docker restart "$CID" >/dev/null
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:14242/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          probe reread || { echo "::error::release smoke failed after restart; this image is not promotable"; exit 1; }

      - uses: sigstore/cosign-installer@v3
      - name: Verify cosign signature
        env:
          TAG: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}:${TAG}" \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/release-docker.yml@.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            | head -50

  scan:
    needs: [meta, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.meta.outputs.version }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
