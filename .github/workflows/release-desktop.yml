name: windows-native-diagnostic
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Source tag to build (e.g. 0.8.4 or 0.8.4-ci1). Bare semver triggers publish; anything with a `-` suffix
          is a dry-run.
        required: true
        type: string
      publish:
        description: Run publish job (R2 + APT + GH release). Disable for build-only smoke tests.
        required: false
        type: boolean
        default: true
      latest:
        description: Mark this version as latest in the auto-updater feed.
        required: false
        type: boolean
        default: false
      build_vulkan:
        description: "ALSO build the OPTIONAL -vulkan GPU variants (Windows + Linux only). Manual downloads only \u2014 NEVER\
          \ added to the auto-updater feed. Off for tag-triggered runs."
        required: false
        type: boolean
        default: false
concurrency:
  group: windows-native-diagnostic-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
  packages: read
  actions: write
env:
  NMEM_BAZEL_REMOTE_CACHE: https://storage.googleapis.com/bazel-cache-nowledge
  GCP_BAZEL_CACHE_PROJECT_ID: ci-cd-503413
  GCP_BAZEL_CACHE_SERVICE_ACCOUNT: github-bazel-cache@ci-cd-503413.iam.gserviceaccount.com
  GCP_BAZEL_CACHE_WORKLOAD_IDENTITY_PROVIDER: projects/789880242959/locations/global/workloadIdentityPools/github-actions/providers/nowledge-mem
jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      is_dry_run: ${{ steps.resolve.outputs.is_dry_run }}
      run_publish: ${{ steps.resolve.outputs.run_publish }}
      run_latest: ${{ steps.resolve.outputs.run_latest }}
      run_vulkan: ${{ steps.resolve.outputs.run_vulkan }}
    steps:
    - id: resolve
      name: Resolve version + source ref + flags
      shell: bash
      env:
        DISPATCH_TAG: ${{ inputs.tag }}
        DISPATCH_PUBLISH: ${{ inputs.publish }}
        DISPATCH_LATEST: ${{ inputs.latest }}
        DISPATCH_VULKAN: ${{ inputs.build_vulkan }}
        PAYLOAD_REF: ${{ github.event.client_payload.ref }}
        PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        PUSH_REF: ${{ github.ref_name }}
        EVENT_NAME: ${{ github.event_name }}
      run: "set -euo pipefail\n# VULKAN is the OPTIONAL -vulkan GPU variant gate. It is ONLY ever\n# opt-in via the workflow_dispatch\
        \ `build_vulkan` input; tag-push and\n# repository_dispatch triggers always leave it off, so the normal\n# automated\
        \ release path is byte-for-byte unchanged.\nVULKAN=\"false\"\ncase \"$EVENT_NAME\" in\n  workflow_dispatch)\n    VERSION=\"\
        $DISPATCH_TAG\"\n    SOURCE_REF=\"v${VERSION}\"\n    PUBLISH=\"$DISPATCH_PUBLISH\"\n    LATEST=\"$DISPATCH_LATEST\"\
        \n    VULKAN=\"$DISPATCH_VULKAN\"\n    ;;\n  push)\n    # tag push on THIS repo \u2014 assume the same tag exists\
        \ on source\n    VERSION=\"${PUSH_REF#v}\"\n    SOURCE_REF=\"$PUSH_REF\"\n    PUBLISH=\"true\"\n    LATEST=\"false\"\
        \n    ;;\n  repository_dispatch)\n    VERSION=\"$PAYLOAD_VERSION\"\n    SOURCE_REF=\"$PAYLOAD_REF\"\n    PUBLISH=\"\
        true\"\n    LATEST=\"false\"\n    ;;\n  *)\n    echo \"::error::Unsupported event: $EVENT_NAME\"\n    exit 1\n   \
        \ ;;\nesac\n# Any pre-release suffix (`-ci*`, `-rc*`, `-beta*`, etc.) is a dry\n# run. Only a bare semver `X.Y.Z`\
        \ ever publishes. Same gate as\n# the private repo's workflow.\nif [[ \"$VERSION\" == *-* ]]; then\n  DRY=\"true\"\
        ; PUBLISH=\"false\"; LATEST=\"false\"\nelse\n  DRY=\"false\"\nfi\n# Normalize VULKAN to a strict true/false (\"\"\
        \ from a non-dispatch\n# trigger becomes false). NEVER touches publish/latest/updater.\nif [[ \"$VULKAN\" == \"true\"\
        \ ]]; then VULKAN=\"true\"; else VULKAN=\"false\"; fi\necho \"version=$VERSION\"        >> \"$GITHUB_OUTPUT\"\necho\
        \ \"source_ref=$SOURCE_REF\"  >> \"$GITHUB_OUTPUT\"\necho \"is_dry_run=$DRY\"         >> \"$GITHUB_OUTPUT\"\necho\
        \ \"run_publish=$PUBLISH\"    >> \"$GITHUB_OUTPUT\"\necho \"run_latest=$LATEST\"      >> \"$GITHUB_OUTPUT\"\necho\
        \ \"run_vulkan=$VULKAN\"      >> \"$GITHUB_OUTPUT\"\necho \"Resolved: version=$VERSION source_ref=$SOURCE_REF dry=$DRY\
        \ publish=$PUBLISH latest=$LATEST vulkan=$VULKAN\"\n"
  build-windows:
    needs: meta
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_REF: ${{ needs.meta.outputs.source_ref }}
    steps:
    - name: Preserve LF source bytes on Windows
      shell: bash
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - name: Checkout private source (nowledge-co/mem)
      uses: actions/checkout@v4
      with:
        repository: nowledge-co/mem
        token: ${{ secrets.MEM_REPO_TOKEN }}
        ref: ${{ env.SOURCE_REF }}
        submodules: false
    - name: Load private HawDB deploy key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SKEIN_REPO_SSH_KEY }}
    - name: Resolve private HawDB submodule over SSH
      shell: bash
      run: |
        set -euo pipefail
        git config --global \
          url."git@github.com:nowledge-co/hawdb.git".insteadOf \
          "https://github.com/nowledge-co/hawdb.git"
    - name: Resolve private Desktop dependency
      id: desktop_dependency
      shell: bash
      run: |
        set -euo pipefail
        if grep -q -- '--init-desktop-https' nowledge-graph/scripts/build-rust-bundle.sh; then
          read -r mode kind sha dependency_path <<< "$(git ls-tree HEAD hawdb)"
          [[ "$mode" == 160000 && "$kind" == commit && "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        fi
    - name: Checkout private Desktop dependency
      if: steps.desktop_dependency.outputs.sha != ''
      uses: actions/checkout@v4
      with:
        repository: nowledge-co/hawdb
        ssh-key: ${{ secrets.SKEIN_REPO_SSH_KEY }}
        ref: ${{ steps.desktop_dependency.outputs.sha }}
        path: hawdb
        persist-credentials: false
    - name: Set up Desktop build Python
      if: steps.desktop_dependency.outputs.sha != ''
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Restore frozen 0.10.79 Desktop lock metadata
      if: steps.desktop_dependency.outputs.sha != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RECOVERY_REPOSITORY: ${{ github.repository }}
        RECOVERY_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        if [[ "$(git rev-parse HEAD)" != "5a272fd06e3624f27de31f4d815cea9a1dddc232" ]]; then
          exit 0
        fi
        export RECOVERY_PATCH="$RUNNER_TEMP/0.10.79-skein-lock.patch"
        gh api --header 'Accept: application/vnd.github.raw+json' \
          "repos/$RECOVERY_REPOSITORY/contents/scripts/recovery/0.10.79-skein-lock.patch?ref=$RECOVERY_SHA" \
          > "$RECOVERY_PATCH"
        python - <<'PYTHON'
        import hashlib
        import os
        from pathlib import Path
        import subprocess

        lock = Path("integrations/skein/nightly-server.Cargo.lock")
        original = lock.read_text(encoding="utf-8")
        assert hashlib.sha256(original.encode()).hexdigest() == "0149da2718b478e639818145d932534c21a58a8cfd8ebba9695ad79a220533ae", "unexpected release lock input"
        lock.write_text(original, encoding="utf-8", newline="\n")
        patch = os.environ["RECOVERY_PATCH"]
        subprocess.run(["git", "apply", "--check", patch], check=True)
        subprocess.run(["git", "apply", patch], check=True)
        assert hashlib.sha256(lock.read_text(encoding="utf-8").encode()).hexdigest() == "df4b2815e9d34f033fc97184531f068937a52f209a245b4edbe6f4af7ade3b9c", "unexpected release lock output"
        print("Restored tagged local-package metadata; registry dependencies remain locked.")
        PYTHON
    - uses: pnpm/action-setup@v4
      with:
        version: 11.22.0
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: nowledge-graph/pnpm-lock.yaml
    - uses: dtolnay/rust-toolchain@1.98.1
      with:
        targets: x86_64-pc-windows-msvc
    - name: Initialize Rust path dependencies before cache restore
      shell: pwsh
      run: |
        "XDG_CACHE_HOME=$env:RUNNER_TEMP/nmem-pdfium-cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        git -c submodule.upstream_forks/ladybug.url=https://github.com/wey-gu/ladybug.git `
            -c submodule.upstream_forks/rig.url=https://github.com/wey-gu/rig.git `
            submodule update --init --depth 1 upstream_forks/ladybug upstream_forks/rig
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: ilammy/setup-nasm@v1
    - uses: Swatinem/rust-cache@v2
      with:
        cache-bin: false
        workspaces: |
          nowledge-graph/src-tauri
          nmem-rs
        cache-directories: ${{ runner.temp }}/nmem-pdfium-cache/pdfium-rs
        key: windows-x86_64-v4-pdfium
    - name: Resolve or repair the PDFium runtime cache
      working-directory: nmem-rs
      shell: pwsh
      run: |
        $pdfiumCache = Join-Path $env:XDG_CACHE_HOME "pdfium-rs"
        $pdfiumDll = Get-ChildItem -Path $pdfiumCache -Filter "pdfium.dll" `
            -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($pdfiumDll) {
          Write-Host "PDFium runtime cache is complete: $($pdfiumDll.FullName)"
          "PDFIUM_LIB_PATH=$($pdfiumDll.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          exit 0
        }

        Write-Host "PDFium runtime cache is incomplete; invalidating liteparse-pdfium-sys build artifacts."
        cargo clean -p liteparse-pdfium-sys --release --target x86_64-pc-windows-msvc
        if ($LASTEXITCODE -ne 0) { throw "cargo clean failed ($LASTEXITCODE)" }
    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.9
    - name: Point sccache at R2
      shell: bash
      env:
        CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        R2_KEY: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
        R2_SECRET: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      run: |
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
          echo "SCCACHE_IDLE_TIMEOUT=0"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          echo "SCCACHE_GHA_ENABLED=false"
          echo "SCCACHE_BUCKET=nowledge-mem-sccache"
          echo "SCCACHE_REGION=auto"
          echo "SCCACHE_ENDPOINT=https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "AWS_ACCESS_KEY_ID=${R2_KEY}"
          echo "AWS_SECRET_ACCESS_KEY=${R2_SECRET}"
        } >> "$GITHUB_ENV"
    - name: Install pnpm deps
      working-directory: nowledge-graph
      run: pnpm install --frozen-lockfile --prefer-offline
    - name: Install protoc
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
      with:
        version: 26.x
        repo-token: ${{ github.token }}
    - name: Verify Rust backend build toolchain (Windows)
      shell: pwsh
      run: |
        rustup target add x86_64-pc-windows-msvc
        if ($LASTEXITCODE -ne 0) { throw "rustup target add failed ($LASTEXITCODE)" }
        foreach ($tool in @("clang", "cmake", "ninja", "protoc")) {
          $resolved = (Get-Command $tool -ErrorAction Stop).Source
          Write-Host "$tool resolved to: $resolved"
        }
        $protoc = (Get-Command protoc -ErrorAction Stop).Source
        "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Host "protoc resolved to: $protoc"
    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        repository-cache: true
    - name: Authenticate Bazel remote cache
      continue-on-error: true
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ env.GCP_BAZEL_CACHE_PROJECT_ID }}
        workload_identity_provider: ${{ env.GCP_BAZEL_CACHE_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.GCP_BAZEL_CACHE_SERVICE_ACCOUNT }}
    - name: Backport Windows PDFium runtime staging compatibility
      shell: pwsh
      run: |
        $scriptPath = "nowledge-graph/scripts/build-rust-bundle.ps1"
        $scriptContent = Get-Content -Path $scriptPath -Raw
        $fixedMarker = '$resolvedCandidates = @((Join-Path $resolvedDir $PdfiumLib))'
        if ($scriptContent.Contains($fixedMarker)) {
          Write-Host "Windows PDFium runtime staging is already fixed in the source ref."
          exit 0
        }

        $oldBlock = @'
                    $candidate = Join-Path $resolvedDir $PdfiumLib
                    if (Test-Path $candidate) { $PdfiumSrc = $candidate }
        '@
        $newBlock = @'
                    $resolvedCandidates = @((Join-Path $resolvedDir $PdfiumLib))
                    if ($Target -like "*windows*") {
                        $resolvedParent = Split-Path -Parent $resolvedDir
                        if ($resolvedParent) {
                            $resolvedCandidates += Join-Path (Join-Path $resolvedParent "bin") $PdfiumLib
                        }
                    }
                    foreach ($candidate in $resolvedCandidates) {
                        if (Test-Path $candidate) { $PdfiumSrc = $candidate; break }
                    }
        '@
        $matchCount = ([regex]::Matches($scriptContent, [regex]::Escape($oldBlock))).Count
        if ($matchCount -ne 1) {
          throw "Expected exactly one legacy PDFium staging block, found $matchCount. Refusing an ambiguous source patch."
        }
        $scriptContent = $scriptContent.Replace($oldBlock, $newBlock)
        Set-Content -Path $scriptPath -Value $scriptContent -NoNewline -Encoding utf8
        Write-Host "Applied Windows PDFium runtime staging compatibility backport."
    - name: Verify immutable diagnostic source
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = 25876c3ea2ceaa0af72cc91bfcf386d1b6c06b9f
        git diff --exit-code HEAD --
    - name: Build Rust backend bundle (Windows)
      working-directory: nowledge-graph
      shell: bash
      run: ./scripts/build-rust-bundle.sh --target x86_64-pc-windows-msvc --bazel-public-binaries --bazel-hawdb-server
    - name: Read compiler diagnostics hidden by the Bazel UI limit
      if: failure()
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $directory = "D:/_bazel/execroot/_main/bazel-out/_tmp/actions"
        $files = @(Get-ChildItem -Path $directory -Filter "stderr-*" -File -ErrorAction SilentlyContinue)
        if (-not $files.Count) { throw "No Bazel action stderr files remain" }
        $output = Join-Path $env:RUNNER_TEMP "windows-native-errors.txt"
        $pattern = 'fatal error|error C[0-9]+|CMake Error|FAILED:|panicked at|Error compiling|cannot open|filename or extension is too long|The system cannot find'
        $secretValues = @(Get-ChildItem Env: | Where-Object { $_.Name -match 'TOKEN|SECRET|PASSWORD|ACCESS_KEY|CREDENTIAL' -and $_.Value.Length -ge 8 } | ForEach-Object { $_.Value })
        $report = @()
        foreach ($file in $files | Sort-Object Length -Descending | Select-Object -First 10) {
            $matches = @(Select-String -Path $file.FullName -Pattern $pattern | Select-Object -First 40)
            if (-not $matches.Count) { continue }
            $report += "Action stderr: $($file.Name), bytes=$($file.Length)"
            foreach ($match in $matches) {
                $line = "line $($match.LineNumber): $($match.Line)"
                foreach ($secret in $secretValues) { $line = $line.Replace($secret, "[REDACTED]") }
                $report += $line
            }
        }
        if (-not $report.Count) { throw "No bounded compiler errors matched; retain the failed state" }
        $report | Set-Content -Path $output -Encoding utf8
        $report | ForEach-Object { Write-Host $_ }
    - name: Retain bounded compiler error evidence
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: windows-native-errors
        path: ${{ runner.temp }}/windows-native-errors.txt
        if-no-files-found: error
        retention-days: 7
