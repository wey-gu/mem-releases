name: install-desktop-upgrade-pause

on:
  workflow_dispatch:
    inputs:
      ga_tag:
        description: "Withdrawn draft GA version to pause"
        required: true
        type: string
      operation_id:
        description: "Fresh UUID for the audited route operation"
        required: true
        type: string

concurrency:
  group: desktop-upgrade-pause-routes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pause:
    runs-on: ubuntu-22.04
    environment: release-publish
    env:
      GA: ${{ inputs.ga_tag }}
      OPERATION_ID: ${{ inputs.operation_id }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VERIFY_PLATFORMS: mac,mac-intel,win,linux-appimage,linux-deb,linux-rpm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate the withdrawal boundary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$GA" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::ga_tag must be clean semver."
            exit 1
          }
          [[ "$OPERATION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || {
            echo "::error::operation_id must be a lowercase UUID v4."
            exit 1
          }
          gh api --paginate --slurp "repos/${REPO}/releases?per_page=100" > .desktop-pause-releases.json

      - name: Select the last usable GA and generate exact pause routes
        run: |
          set -euo pipefail
          node scripts/prepare-desktop-pause.mjs \
            --paused-version "$GA" \
            --releases-json .desktop-pause-releases.json \
            --config wrangler.desktop-upgrade-pause.jsonc \
            --output .desktop-upgrade-pause.generated.json \
            --plan .desktop-pause-plan.json
          previous_version="$(jq -r .fallback_version .desktop-pause-plan.json)"
          published_at="$(jq -r .fallback_published_at .desktop-pause-plan.json)"
          {
            echo "PREVIOUS_VERSION=${previous_version}"
            echo "VERIFY_PREVIOUS_DESKTOP_VERSION=${previous_version}"
            echo "VERIFY_FALLBACK_VERSION=${previous_version}"
            echo "FALLBACK_PUBLISHED_AT=${published_at}"
          } >> "$GITHUB_ENV"

      - name: Retain the selected fallback before production mutation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-pause-plan-${{ inputs.operation_id }}
          path: .desktop-pause-plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Verify the controlled authority is already stopped
        run: node scripts/verify-upgrade-pause.mjs --desktop-only --controlled-only

      - name: Install pinned Wrangler
        run: npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@4.131.0

      - name: Install the exact release pause routes
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --config .desktop-upgrade-pause.generated.json \
            --message "Pause Desktop ${GA} distribution (${OPERATION_ID})" \
            --var "PAUSE_OPERATION_ID:${OPERATION_ID}" \
            --var "PAUSED_VERSION:${GA}" \
            --var "FALLBACK_VERSION:${PREVIOUS_VERSION}" \
            --var "FALLBACK_PUBLISHED_AT:${FALLBACK_PUBLISHED_AT}"

      - name: Verify all paused distribution channels
        env:
          VERIFY_FALLBACK_PLAN: .desktop-pause-plan.json
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if node scripts/verify-upgrade-pause.mjs; then
              break
            fi
            [[ "$attempt" -lt 12 ]] || exit 1
            sleep 5
          done

          verify_paused() {
            local label="$1"
            local url="$2"
            local headers body status
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' \
              -H "User-Agent: Nowledge-Mem/${PREVIOUS_VERSION} (Tauri)" "$url")"
            [[ "$status" == "503" ]] || {
              echo "::error::${label} expected 503, got ${status}."
              exit 1
            }
            grep -Eiq '^cache-control:.*no-store' "$headers"
            grep -Eiq "^x-mem-upgrade-pause: ${OPERATION_ID}" "$headers"
            grep -Eiq 'temporarily paused' "$body"
          }

          verify_paused "versioned Backbone download" \
            "https://backbone-mem.nowledge.co/download/${GA}/mac"
          verify_paused "versioned CDN download" \
            "https://download-mem.nowledge.co/app/${GA}/aarch64-apple-darwin.dmg"
          curl -fsS -H 'Range: bytes=0-0' \
            -H "User-Agent: Nowledge-Mem/${PREVIOUS_VERSION} (Tauri)" -o /dev/null \
            "https://download-mem.nowledge.co/app/${PREVIOUS_VERSION}/aarch64-apple-darwin.dmg"
          curl -fsS -H "User-Agent: Nowledge-Mem/${PREVIOUS_VERSION} (Tauri)" \
            -o /dev/null "https://backbone-mem.nowledge.co/health"

      - name: Summary
        run: |
          {
            echo "### Desktop upgrade pause installed"
            echo "- Route operation: ${OPERATION_ID}"
            echo "- Paused version: ${GA}"
            echo "- Retained public release: ${PREVIOUS_VERSION}"
            echo "- Automatically selected latest usable GA: ${PREVIOUS_VERSION}"
            echo "- Exact pause routes: 6"
            echo "- Controlled stop and legacy fallback readback: six platforms verified"
            echo "- Versioned ${GA} downloads and APT: blocked"
            echo "- Install packages and tags: retained"
          } >> "$GITHUB_STEP_SUMMARY"
