# Mobile release workflow for Nowledge Mem.
#
# Replaces the manual local flow:
#   iOS      cd nowledge-graph/mobile && ./build-ios-appstore.sh   (needs Xcode,
#            an Apple Distribution cert, the provisioning profile, and an App
#            Store Connect API key on the operator's machine)
#   Android  npx tauri android build, then hand-upload the APK to a
#            nowledge-co/community release
#
# Source is fetched from the private nowledge-co/mem at the given tag, same as
# release-desktop.yml. The mobile app is a THIN client: its Cargo manifest pulls
# only tauri + objc2, none of the nmem-* crates and none of the ladybug /
# liteparse / rig forks, so no submodule init is needed here.
#
# Triggers: workflow_dispatch only. Mobile is deliberately not wired to tag
# pushes -- a TestFlight upload cannot be recalled, and Apple rejects a
# duplicate CFBundleVersion, so re-running a tag must be a decision.
#
# First-time setup: see the "Secrets" block below. Until every secret exists,
# run with publish=false, which builds and signs but uploads nothing.

name: release-mobile

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Source tag to build (e.g. 0.10.64). Must already exist on nowledge-co/mem."
        required: true
        type: string
      ios:
        description: "Build and upload the iOS app to TestFlight."
        required: false
        type: boolean
        default: true
      android:
        description: "Build the Android APK."
        required: false
        type: boolean
        default: true
      publish:
        description: "Upload. OFF = build + sign only, no TestFlight submission and no community release. Use this for the first run."
        required: false
        type: boolean
        default: false

concurrency:
  group: release-mobile-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios-testflight:
    name: iOS -> TestFlight
    if: inputs.ios
    runs-on: macos-15
    timeout-minutes: 90
    env:
      SOURCE_REF: v${{ inputs.tag }}
      VERSION: ${{ inputs.tag }}
    steps:
      - name: Checkout private source (nowledge-co/mem)
        uses: actions/checkout@v4
        with:
          repository: nowledge-co/mem
          token: ${{ secrets.MEM_REPO_TOKEN }}
          ref: ${{ env.SOURCE_REF }}
          submodules: false

      # Fail before any 40-minute build if the version set is inconsistent.
      # App Store Connect rejects a duplicate or non-incrementing CFBundleVersion
      # with ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE (-19232), and the local
      # script already refuses this; doing it here just fails faster.
      - name: Verify mobile version matches the tag
        shell: bash
        run: |
          set -euo pipefail
          CONF="nowledge-graph/mobile/src-tauri/tauri.conf.json"
          PLIST="nowledge-graph/mobile/src-tauri/gen/apple/nowledge-mem-mobile_iOS/Info.plist"
          TAURI_VER="$(jq -r .version "$CONF")"
          SHORT="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$PLIST")"
          echo "tag=$VERSION tauri.conf=$TAURI_VER plist.short=$SHORT plist.build=$BUILD"
          for got in "$TAURI_VER" "$SHORT" "$BUILD"; do
            if [[ "$got" != "$VERSION" ]]; then
              echo "::error::Mobile version mismatch. Tag $VERSION but found $got."
              echo "::error::See the VERSION BUMP CHECKLIST in nowledge-graph/CHANGELOG.md."
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          # The web frontend is built by tauri's beforeBuildCommand
          # (`npm --prefix .. run build:mobile`), so the PARENT project's
          # dependencies are needed too, not just mobile/.
          npm --prefix nowledge-graph ci --no-audit --no-fund
          npm --prefix nowledge-graph/mobile ci --no-audit --no-fund

      # Import the Apple Distribution certificate into an ephemeral keychain.
      #
      # APPLE_CERTIFICATE is scoped to THIS step on purpose and must never be
      # added to the build step's env. Tauri auto-imports it when it sees it,
      # and because `security export -t identities` yields a multi-identity
      # .p12, tauri picks the FIRST identity in the bundle -- here that is the
      # Developer ID cert, not the Apple Distribution one iOS needs. That
      # mismatch has bitten the desktop workflow before. Keeping the variable
      # out of the build step leaves tauri to use the keychain we populate.
      - name: Import signing certificate
        env:
          # Reuses the DESKTOP certificate secret on purpose. It is produced by
          # `security export -k login.keychain-db -t identities`, and that
          # command ignores its trailing identity filter -- it exports every
          # identity in the keychain, which includes
          # "Apple Distribution: Nowledge Labs, LLC (JMU55RJW2K)" alongside the
          # Developer ID one. Verified 2026-08-16 against the source keychain.
          # So iOS needs no separate certificate secret; the build script picks
          # the Apple Distribution identity out of the imported set and the
          # TeamIdentifier assertion proves it chose right.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$APPLE_CERTIFICATE" ]] || { echo "::error::APPLE_CERTIFICATE is not set"; exit 1; }
          CERT_P12="$RUNNER_TEMP/ios_dist.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_P12"
          KEYCHAIN="$RUNNER_TEMP/ios-build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_P12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_P12"
          echo "IOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "Identities in the build keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/^/  /'

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$IOS_PROVISIONING_PROFILE_B64" ]] || { echo "::error::IOS_PROVISIONING_PROFILE is not set"; exit 1; }
          PROFILE="$RUNNER_TEMP/nowledge-mem.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_B64" | base64 --decode > "$PROFILE"
          # Xcode still needs it in its own directory for the archive step; the
          # re-signing later reads it from IOS_PROVISIONING_PROFILE directly.
          DEST="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$DEST"
          cp "$PROFILE" "$DEST/"
          echo "IOS_PROVISIONING_PROFILE=$PROFILE" >> "$GITHUB_ENV"
          NAME="$(security cms -D -i "$PROFILE" | plutil -extract Name raw - 2>/dev/null || echo '?')"
          EXPIRES="$(security cms -D -i "$PROFILE" | plutil -extract ExpirationDate raw - 2>/dev/null || echo '?')"
          echo "Profile: $NAME (expires $EXPIRES)"

      # APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_BASE64 already exist in
      # this repo -- setup-github-secrets.sh has staged them since the desktop
      # scaffold was built, they were just never consumed by a workflow.
      - name: Stage App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$APPLE_API_KEY" ]] || { echo "::error::APPLE_API_KEY is not set"; exit 1; }
          [[ -n "$APPLE_API_KEY_BASE64" ]] || { echo "::error::APPLE_API_KEY_BASE64 is not set"; exit 1; }
          # `xcrun altool --apiKey` takes an ID, not a path, and searches a fixed
          # set of directories for AuthKey_<id>.p8.
          DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$DIR"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$DIR/AuthKey_${APPLE_API_KEY}.p8"
          chmod 600 "$DIR/AuthKey_${APPLE_API_KEY}.p8"

      - name: Build, sign and upload to TestFlight
        working-directory: nowledge-graph/mobile
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Empty when the caller left it unset; the script derives the identity
          # from the keychain and the TeamIdentifier assertion catches a bad pick.
          IOS_SIGN_IDENTITY: ${{ secrets.IOS_SIGN_IDENTITY }}
          NMEM_SKIP_UPLOAD: ${{ inputs.publish && '0' || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NMEM_SKIP_UPLOAD" == "1" ]]; then
            echo "::notice::publish=false — building and signing only, no TestFlight upload."
            ./build-ios-appstore.sh --no-upload
          else
            ./build-ios-appstore.sh
          fi

      - name: Upload IPA as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NowledgeMem-${{ inputs.tag }}-ios
          path: nowledge-graph/mobile/build-output/*.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### iOS ${VERSION}"
            echo
            if [[ "${{ job.status }}" == "success" ]]; then
              if [[ "${{ inputs.publish }}" == "true" ]]; then
                echo "Uploaded to App Store Connect. TestFlight shows the build in ~15 minutes."
              else
                echo "Built and signed. Not uploaded (publish=false)."
              fi
            else
              echo "FAILED. Common causes:"
              echo "- provisioning profile expired (printed in the install step)"
              echo "- CFBundleVersion already used in App Store Connect (error -19232)"
              echo "- wrong signing identity: the TeamIdentifier assertion in the script names it"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  android-apk:
    name: Android -> APK
    if: inputs.android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_REF: v${{ inputs.tag }}
      VERSION: ${{ inputs.tag }}
    steps:
      - name: Checkout private source (nowledge-co/mem)
        uses: actions/checkout@v4
        with:
          repository: nowledge-co/mem
          token: ${{ secrets.MEM_REPO_TOKEN }}
          ref: ${{ env.SOURCE_REF }}
          submodules: false

      - name: Verify mobile version matches the tag
        shell: bash
        run: |
          set -euo pipefail
          TAURI_VER="$(jq -r .version nowledge-graph/mobile/src-tauri/tauri.conf.json)"
          if [[ "$TAURI_VER" != "$VERSION" ]]; then
            echo "::error::Tag $VERSION does not match mobile tauri.conf.json $TAURI_VER"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix nowledge-graph ci --no-audit --no-fund
          npm --prefix nowledge-graph/mobile ci --no-audit --no-fund

      # keystore.properties is gitignored on purpose. `storeFile` is resolved
      # relative to gen/android/app, so the keystore is written next to it.
      - name: Install signing keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          for v in ANDROID_KEYSTORE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            [[ -n "${!v}" ]] || { echo "::error::$v is not set"; exit 1; }
          done
          APPDIR="nowledge-graph/mobile/src-tauri/gen/android/app"
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$APPDIR/upload-keystore.jks"
          # build.gradle.kts reads exactly these three keys and uses `password`
          # for both storePassword and keyPassword.
          {
            echo "storeFile=upload-keystore.jks"
            echo "password=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
          } > "$APPDIR/keystore.properties"
          chmod 600 "$APPDIR/keystore.properties" "$APPDIR/upload-keystore.jks"

      - name: Build APK
        working-directory: nowledge-graph/mobile
        shell: bash
        run: |
          set -euo pipefail
          # tauri regenerates gen/android/app/tauri.properties (gitignored) from
          # tauri.conf.json on every build, so versionCode/versionName follow the
          # tag automatically. A stale checkout cannot pin an old versionCode here.
          npx tauri android build

      - name: Locate and verify the APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find nowledge-graph/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release -name '*.apk' | head -1)"
          [[ -n "$APK" && -f "$APK" ]] || { echo "::error::No universal release APK produced"; exit 1; }
          # An unsigned APK installs nowhere. Prove the signature exists rather
          # than trusting that keystore.properties was picked up.
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | sed 's/^/  /'
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: NowledgeMem-${{ inputs.tag }}-android
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

      # The release process already creates a v<version> tag on
      # nowledge-co/community, so this attaches to a ref that exists rather than
      # creating a second source of truth.
      - name: Publish APK to nowledge-co/community release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.COMMUNITY_REPO_TOKEN }}
          APK: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo "::error::COMMUNITY_REPO_TOKEN is not set"; exit 1; }
          TAG="v${VERSION}"
          if ! gh release view "$TAG" -R nowledge-co/community >/dev/null 2>&1; then
            echo "Creating release $TAG"
            gh release create "$TAG" -R nowledge-co/community \
              --title "$TAG" --notes "Nowledge Mem Android APK $VERSION"
          fi
          gh release upload "$TAG" "$APK" -R nowledge-co/community --clobber
          echo "Uploaded $(basename "$APK") to nowledge-co/community@$TAG"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Android ${VERSION}"
            echo
            echo "APK: \`${{ steps.apk.outputs.path }}\` (${{ steps.apk.outputs.size }})"
            if [[ "${{ inputs.publish }}" == "true" ]]; then
              echo "Published to https://github.com/nowledge-co/community/releases/tag/v${VERSION}"
            else
              echo "Not published (publish=false). The APK is attached to this run as an artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
