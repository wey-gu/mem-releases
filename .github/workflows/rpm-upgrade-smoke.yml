# RPM upgrade smoke on real Fedora, without compiling anything.
#
# The RPM packaging changes in nowledge-co/mem (payload layout, compat stubs,
# maintainer scripts) do not change any binary. So this job takes the
# binaries from a PUBLISHED RPM, re-bundles them with the candidate source's
# Tauri config at two higher versions (A, B), and runs real `dnf` installs in
# a Fedora container:
#   base (published) -> A : first upgrade from an affected release. The OLD
#                           package's %postun runs last, so its behavior is
#                           reported, not asserted.
#   A -> B              : both packages carry the candidate scripts. Asserted:
#                           CLI links survive the upgrade (#7119), the
#                           /usr/lib/nowledge-mem stubs run, no binary is
#                           installed twice.
#   remove B            : asserted: CLI links are removed.
name: rpm-upgrade-smoke

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "nowledge-co/mem ref whose packaging config is tested"
        required: true
        default: main
      base_version:
        description: "Published release whose RPM is the upgrade base"
        required: true
        default: "0.10.101"
      fedora:
        description: "Fedora container image"
        required: true
        default: "fedora:41"
  pull_request:
    paths:
      - .github/workflows/rpm-upgrade-smoke.yml
      - scripts/rpm-upgrade-smoke-fedora.sh

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # PR runs test the open packaging PR branch until it merges.
      SOURCE_REF: ${{ inputs.source_ref || 'perf/rpm-compression-none' }}
      BASE: ${{ inputs.base_version || '0.10.101' }}
      FEDORA: ${{ inputs.fedora || 'fedora:41' }}
      VER_A: 0.10.990
      VER_B: 0.10.991
    steps:
      - uses: actions/checkout@v4
        with:
          path: release-tools

      - name: Checkout packaging source (nowledge-co/mem)
        uses: actions/checkout@v4
        with:
          repository: nowledge-co/mem
          token: ${{ secrets.MEM_REPO_TOKEN }}
          ref: ${{ env.SOURCE_REF }}
          path: mem
          submodules: false
          sparse-checkout: nowledge-graph

      - name: Install rpm tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm cpio jq libarchive-tools libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download the published base RPM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rpms"
          gh release download "v${BASE}" -R "${{ github.repository }}" -p '*.x86_64.rpm' -D "$RUNNER_TEMP/base"
          mv "$RUNNER_TEMP"/base/*.rpm "$RUNNER_TEMP/rpms/base.rpm"
          ls -l "$RUNNER_TEMP/rpms"

      - name: Stage the published binaries for re-bundling
        working-directory: mem/nowledge-graph
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/base-root"
          mkdir -p "$ROOT"
          # rpm2cpio first; libarchive's bsdtar reads RPMs directly as a fallback.
          if ! (cd "$ROOT" && rpm2cpio "$RUNNER_TEMP/rpms/base.rpm" > "$RUNNER_TEMP/base.cpio" \
                && cpio -idm < "$RUNNER_TEMP/base.cpio" 2>&1 | tail -5); then
            echo "::warning::rpm2cpio/cpio failed; trying bsdtar"
            rm -rf "$ROOT" && mkdir -p "$ROOT"
            bsdtar -xf "$RUNNER_TEMP/rpms/base.rpm" -C "$ROOT"
          fi
          rm -f "$RUNNER_TEMP/base.cpio"
          echo "Base RPM layout:"; find "$ROOT" -maxdepth 4 | sed "s#^$ROOT##" | head -40
          MAIN="$(find "$ROOT" -type f -name nowledge-mem -path '*/bin/*' -print -quit || true)"
          RES="$(find "$ROOT" -type d -name rust-backend -print -quit || true)"
          [[ -f "$MAIN" && -d "$RES" ]] || { echo "::error::unexpected base RPM layout (main=$MAIN res=$RES)"; exit 1; }
          echo "main=$MAIN res=$RES"
          mkdir -p src-tauri/target/release
          # Tauri patches a bundle-type marker into the main binary per
          # package and refuses a binary that is already patched; restore the
          # unpatched placeholder (same length) so `tauri bundle` can run.
          python3 - "$MAIN" src-tauri/target/release/nowledge-mem <<'PY'
          import sys
          data = open(sys.argv[1], "rb").read()
          for t in (b"RPM", b"DEB", b"APP"):
              data = data.replace(b"__TAURI_BUNDLE_TYPE_VAR_" + t, b"__TAURI_BUNDLE_TYPE_VAR_UNK")
          assert b"__TAURI_BUNDLE_TYPE_VAR_UNK" in data, "bundle-type marker not found"
          open(sys.argv[2], "wb").write(data)
          PY
          chmod 755 src-tauri/target/release/nowledge-mem
          rm -rf rust-backend && mkdir -p rust-backend
          cp -a "$RES"/. rust-backend/
          find rust-backend -maxdepth 1 | head -20

      - name: Re-bundle candidate RPMs A and B
        working-directory: mem/nowledge-graph
        run: |
          set -euo pipefail
          CLI_VERSION="$(jq -r '.devDependencies["@tauri-apps/cli"] // .dependencies["@tauri-apps/cli"]' package.json)"
          for V in "$VER_A" "$VER_B"; do
            rm -rf src-tauri/target/release/bundle/rpm
            npx -y "@tauri-apps/cli@${CLI_VERSION}" bundle --bundles rpm --config "{\"version\":\"$V\"}"
            RPM="$(find src-tauri/target/release/bundle/rpm -name '*.rpm' -type f | head -1)"
            [[ -f "$RPM" ]] || { echo "::error::no RPM for $V"; exit 1; }
            ./scripts/verify-linux-package.sh "$RPM"
            cp "$RPM" "$RUNNER_TEMP/rpms/$V.rpm"
          done
          ls -l "$RUNNER_TEMP/rpms"

      - name: Upgrade and remove on Fedora
        run: |
          set -euo pipefail
          docker run --rm -v "$RUNNER_TEMP/rpms:/rpms:ro" \
            -v "$GITHUB_WORKSPACE/release-tools/scripts/rpm-upgrade-smoke-fedora.sh:/smoke.sh:ro" \
            -e VER_A -e VER_B "$FEDORA" bash /smoke.sh | tee "$RUNNER_TEMP/smoke.log"
          grep '^SUMMARY' "$RUNNER_TEMP/smoke.log" >> "$GITHUB_STEP_SUMMARY" || true
