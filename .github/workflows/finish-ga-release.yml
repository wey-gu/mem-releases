name: finish-ga-release

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: "RC version already uploaded to this repo's GH Release (e.g. 0.9.4-rc1; no leading v)"
        required: true
        type: string
      ga_tag:
        description: "GA version already promoted to R2/Docker (and APT for normal GA; clean semver)"
        required: true
        type: string
      allow_newer_desktop_latest:
        description: "For an older out-of-band GA only: allow desktop latest to remain at a newer GA"
        type: boolean
        default: false

concurrency:
  group: finish-ga-${{ github.event.inputs.ga_tag }}
  cancel-in-progress: false

permissions:
  actions: read # Read release-publish protection before production mutation.
  contents: write

jobs:
  finish:
    runs-on: ubuntu-22.04
    concurrency:
      group: ga-desktop-publication
      cancel-in-progress: false
    environment: release-publish
    env:
      RC: ${{ inputs.rc_tag }}
      GA: ${{ inputs.ga_tag }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check GA website metadata before distribution
        env:
          GH_TOKEN: ${{ github.token }}
          MEM_METADATA_TOKEN: ${{ secrets.MEM_METADATA_TOKEN }}
          ALLOW_NEWER: ${{ inputs.allow_newer_desktop_latest || false }}
        run: node scripts/finalize-ga-release.mjs preflight "$GA" "$ALLOW_NEWER"

      - name: Validate inputs
        run: |
          set -euo pipefail
          if ! [[ "$GA" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::GA tag '$GA' must be clean semver."
            exit 1
          fi
          if [[ "${RC%%-*}" != "$GA" ]]; then
            echo "::error::RC base '${RC%%-*}' does not match GA '$GA'."
            exit 1
          fi

      - name: Refuse to modify a published GA Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if draft="$(gh api "repos/${{ github.repository }}/releases/tags/v${GA}" --jq .draft 2>release-lookup.err)"; then
            if [[ "$draft" != "true" ]]; then
              echo "::error::v${GA} is already published; recovery must not replace its assets."
              exit 1
            fi
          elif ! grep -q 'HTTP 404' release-lookup.err; then
            cat release-lookup.err >&2
            exit 1
          fi

      - name: Clone mem-backbone (private)
        env:
          PAT: ${{ secrets.MEM_BACKBONE_PAT }}
        run: |
          set -euo pipefail
          AUTH_B64="$(printf 'x-access-token:%s' "$PAT" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=Authorization: Basic ${AUTH_B64}" \
              clone --depth=1 https://github.com/nowledge-co/mem-backbone.git mem-backbone
          git -C mem-backbone config --unset-all http.https://github.com/.extraheader || true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install mem-backbone npm deps
        working-directory: mem-backbone
        run: npm ci --no-audit --no-fund

      - name: Purge Cloudflare edge cache for uploaded keys
        if: ${{ env.CLOUDFLARE_ZONE_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          host="${CUSTOM_DOMAIN:-download-mem.nowledge.co}"
          host="${host#https://}"
          host="${host#http://}"
          host="${host%/}"
          urls=(
            "https://${host}/app/${GA}/aarch64-apple-darwin.dmg"
            "https://${host}/app/${GA}/x86_64-apple-darwin.dmg"
            "https://${host}/app/${GA}/x86_64-pc-windows-msvc.exe"
            "https://${host}/app/${GA}/x86_64-unknown-linux-gnu.deb"
            "https://${host}/app/${GA}/x86_64-unknown-linux-gnu.AppImage"
          )
          files_json=$(printf '"%s",' "${urls[@]}")
          files_json="[${files_json%,}]"
          echo "Purging ${#urls[@]} URLs on zone ${CLOUDFLARE_ZONE_ID:0:8}..."
          response="$(curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"files\":${files_json}}")"
          echo "$response" | python3 -m json.tool
          echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('success') else 1)"

      - name: Verify download delivery (R2 + optional APT + Worker)
        working-directory: mem-backbone
        run: |
          set -euo pipefail
          echo "Pre-settle 20s before first verify attempt..."
          sleep 20

          scope='latest,latest-redirect,direct,update'
          health_scope='latest'
          if [[ "${{ inputs.allow_newer_desktop_latest }}" != "true" ]]; then
            scope="${scope},apt"
            health_scope="${health_scope},apt"
          fi

          attempts=5
          delay=15
          for i in $(seq 1 "$attempts"); do
            echo "::group::Verify download delivery (attempt $i/$attempts)"
            export VERIFY_RELEASE_VERSION="$GA" VERIFY_SCOPE="$scope"
            export VERIFY_PLATFORMS="mac,mac-intel,win,linux,linux-deb,linux-appimage"
            export VERIFY_ALLOW_NEWER_LATEST="${{ inputs.allow_newer_desktop_latest }}"
            if VERIFY_SCOPE="$health_scope" timeout -k 10s 90s node scripts/verify-download-delivery.mjs &&
               timeout -k 10s 90s node ../scripts/verify-ga-delivery.mjs; then
              echo "::endgroup::"
              echo "Download delivery verified on attempt $i."
              exit 0
            fi
            echo "::endgroup::"
            if [[ "$i" -lt "$attempts" ]]; then
              echo "::warning::Verify attempt $i/$attempts failed (likely edge propagation race); retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "::error::Download delivery did not verify after ${attempts} attempts."
          exit 1

      - name: Download RC assets from this repo's GH Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p rc-artifacts
          gh release download "v${RC}" --dir rc-artifacts --repo "${{ github.repository }}"

      - name: Rename RC suffix to GA in every artifact
        id: rename
        shell: bash
        run: |
          set -euo pipefail
          cd rc-artifacts
          for f in *; do
            new="${f//${RC}/${GA}}"
            if [[ "$f" != "$new" ]]; then
              mv -v -- "$f" "$new"
            fi
          done
          DMG_ARM="$(find . -maxdepth 1 -type f -iname '*aarch64*.dmg' -print -quit)"
          DMG_X64="$(find . -maxdepth 1 -type f \( -iname '*x86_64*.dmg' -o -iname '*x64*.dmg' \) -print -quit)"
          EXE_WIN="$(find . -maxdepth 1 -type f -iname '*.exe' -print -quit)"
          DEB="$(find . -maxdepth 1 -type f -iname '*.deb' -print -quit)"
          APPIMG="$(find . -maxdepth 1 -type f -iname '*.AppImage' -print -quit)"
          for kv in DMG_ARM:"$DMG_ARM" DMG_X64:"$DMG_X64" EXE_WIN:"$EXE_WIN" DEB:"$DEB" APPIMG:"$APPIMG"; do
            name="${kv%%:*}"; val="${kv#*:}"
            if [[ -z "$val" || ! -f "$val" ]]; then
              echo "::error::Missing artifact after rename: $name"
              exit 1
            fi
          done
          {
            echo "dmg_arm=$PWD/$DMG_ARM"
            echo "dmg_x64=$PWD/$DMG_X64"
            echo "exe_win=$PWD/$EXE_WIN"
            echo "deb=$PWD/$DEB"
            echo "appimg=$PWD/$APPIMG"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft GA GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${GA}"
          REPO="${{ github.repository }}"
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" \
              --title "Nowledge Mem ${GA}" \
              --draft \
              --notes "Promoted from v${RC}. Same bits; generated by finish-ga-release after the core promotion stopped before GA Release creation." \
              || gh release view "$TAG" -R "$REPO" >/dev/null
          fi
          node scripts/upload-draft-release-assets.mjs "$TAG" "$REPO" \
            "${{ steps.rename.outputs.dmg_arm }}" \
            "${{ steps.rename.outputs.dmg_x64 }}" \
            "${{ steps.rename.outputs.exe_win }}" \
            "${{ steps.rename.outputs.deb }}" \
            "${{ steps.rename.outputs.appimg }}"

      - name: Finalize GA publication and metadata
        env:
          GH_TOKEN: ${{ github.token }}
          MEM_REPO_TOKEN: ${{ secrets.MEM_REPO_TOKEN }}
          MEM_METADATA_TOKEN: ${{ secrets.MEM_METADATA_TOKEN }}
          ALLOW_NEWER: ${{ inputs.allow_newer_desktop_latest || false }}
        run: node scripts/finalize-ga-release.mjs publish "$GA" "$ALLOW_NEWER"

      - name: Summary
        run: |
          {
            echo "### Finished GA ${GA}"
            echo "- Desktop latest: dynamically discovered from R2 (verified)"
            if [[ "${{ inputs.allow_newer_desktop_latest }}" == "true" ]]; then
              echo "- Delivery verified for: latest, latest redirect, direct downloads, update feed (APT unchanged)"
            else
              echo "- Delivery verified for: latest, latest redirect, direct downloads, update feed, APT"
            fi
            echo "- GH release tag: v${GA} (published; metadata verified)"
          } >> "$GITHUB_STEP_SUMMARY"
