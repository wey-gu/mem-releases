name: testflight-contract

on:
  pull_request:
    paths:
      - .github/workflows/distribute-testflight-existing.yml
      - .github/workflows/testflight-contract.yml
      - scripts/testflight-distribute.py
      - scripts/test_testflight_distribute.py
  push:
    branches: [main]
    paths:
      - .github/workflows/distribute-testflight-existing.yml
      - .github/workflows/testflight-contract.yml
      - scripts/testflight-distribute.py
      - scripts/test_testflight_distribute.py

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyjwt cryptography
      - run: python -m unittest discover -s scripts -p test_testflight_distribute.py
